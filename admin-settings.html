<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Evonance – Admin Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e17; --card: #111827; --card-hover: #1a2332;
      --primary: #f59e0b; --primary-dark: #d97706; --primary-soft: rgba(245, 158, 11, 0.1);
      --accent: #fbbf24; --text: #f1f5f9; --muted: #94a3b8; --border: #1e293b;
      --input-bg: #0f172a; --success: #10b981; --error: #ef4444; --warning: #f59e0b; --info: #3b82f6;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); display: flex; }
    
    .sidebar { width: 260px; min-height: 100vh; background: var(--card); border-right: 1px solid var(--border); padding: 20px 0; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .sidebar-logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), #fbbf24); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .sidebar-logo-icon svg { width: 20px; height: 20px; color: #1a1a1a; }
    .sidebar-brand { font-size: 1.1rem; font-weight: 800; color: var(--text); }
    .sidebar-brand span { color: var(--primary); }
    .sidebar-nav { flex: 1; padding: 0 12px; }
    .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; margin-bottom: 4px; }
    .sidebar-link:hover { background: var(--card-hover); color: var(--text); }
    .sidebar-link.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
    .sidebar-link svg { width: 20px; height: 20px; flex-shrink: 0; }
    .sidebar-footer { padding: 16px 20px 0; border-top: 1px solid var(--border); margin-top: auto; }
    .sidebar-user { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .sidebar-avatar { width: 36px; height: 36px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: #1a1a1a; }
    .sidebar-user-info { flex: 1; }
    .sidebar-user-name { font-size: 0.8rem; font-weight: 600; }
    .sidebar-user-role { font-size: 0.68rem; color: var(--primary); }
    .sidebar-logout { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; color: #fca5a5; cursor: pointer; font-size: 0.82rem; font-weight: 500; transition: all 0.2s; background: none; border: none; width: 100%; font-family: inherit; }
    .sidebar-logout:hover { background: rgba(239, 68, 68, 0.1); }
    .sidebar-logout svg { width: 18px; height: 18px; }
    
    .main-content { flex: 1; margin-left: 260px; padding: 24px; }
    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
    .page-subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
    
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    
    .section-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
    .section-card.full { grid-column: 1 / -1; }
    .section-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .section-card h3 svg { width: 20px; height: 20px; color: var(--primary); }
    
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .form-input { width: 100%; height: 46px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 0.9rem; color: var(--text); outline: none; }
    .form-input:focus { border-color: var(--primary); }
    select.form-input { cursor: pointer; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-inline { display: flex; gap: 10px; align-items: center; }
    .form-inline .form-input { width: 80px; text-align: center; }
    .form-inline span { color: var(--muted); font-size: 0.85rem; }
    
    .save-btn { width: 100%; padding: 12px; background: var(--primary); color: #1a1a1a; border: none; border-radius: 12px; font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
    .save-btn:hover { background: var(--primary-dark); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .current-value { font-size: 0.75rem; color: var(--success); margin-top: 4px; }
    
    .upload-area { border: 2px dashed var(--border); border-radius: 14px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 12px; }
    .upload-area:hover { border-color: var(--primary); background: var(--primary-soft); }
    .upload-icon { font-size: 2rem; margin-bottom: 6px; }
    .upload-text { font-size: 0.82rem; color: var(--muted); }
    .file-input { display: none; }
    .preview-img { max-width: 200px; max-height: 100px; border-radius: 10px; margin-top: 10px; display: none; }
    .preview-img.show { display: block; }
    
    .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(0,0,0,0.2); border-top-color: #1a1a1a; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .toast { position: fixed; top: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 24px; display: flex; align-items: center; gap: 12px; z-index: 1000; transform: translateX(120%); transition: transform 0.5s; box-shadow: 0 20px 40px rgba(0,0,0,0.5); max-width: 380px; }
    .toast.show { transform: translateX(0); }
    .toast.success { border-left: 4px solid var(--success); }
    .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .toast.success .toast-icon { background: rgba(16,185,129,0.15); }
    .toast-icon svg { width: 20px; height: 20px; color: var(--success); }
    .toast-content h4 { font-size: 0.9rem; font-weight: 700; }
    .toast-content p { font-size: 0.75rem; color: var(--muted); }

    @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; } .settings-grid { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    <span class="sidebar-brand">Ev<span>onance</span></span>
  </div>
  <nav class="sidebar-nav">
    <a href="admin-dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="admin-users.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>Users</a>
    <a href="admin-deposits.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Deposits</a>
    <a href="admin-withdrawals.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="12" y1="10" x2="12" y2="18"/><polyline points="9 15 12 18 15 15"/></svg>Withdrawals</a>
    <a href="admin-investments.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Investments</a>
    <a href="admin-notifications.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>Notifications</a>
    <a href="admin-settings.html" class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user"><div class="sidebar-avatar">A</div><div class="sidebar-user-info"><div class="sidebar-user-name">Admin</div><div class="sidebar-user-role">Administrator</div></div></div>
    <button class="sidebar-logout" onclick="handleLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</button>
  </div>
</aside>

<main class="main-content">
  <div class="page-header">
    <h1 class="page-title">Settings</h1>
    <p class="page-subtitle">Configure bank details and site parameters</p>
  </div>

  <div class="settings-grid">
    
    <!-- Bank Details -->
    <div class="section-card">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Bank Account Details</h3>
      <p style="font-size:0.75rem;color:var(--muted);margin-bottom:14px;">These details appear on the user's deposit page</p>
      
      <div class="form-group">
        <label class="form-label">Bank Name</label>
        <input type="text" class="form-input" id="bankName" placeholder="e.g., GTBank" />
        <div class="current-value" id="currentBankName"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Account Number</label>
        <input type="text" class="form-input" id="accountNumber" placeholder="e.g., 0123456789" />
        <div class="current-value" id="currentAccountNumber"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Account Name</label>
        <input type="text" class="form-input" id="accountName" placeholder="e.g., Evonance Ventures" />
        <div class="current-value" id="currentAccountName"></div>
      </div>
      
      <button class="save-btn" onclick="saveBankDetails()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg>
        Save Bank Details
      </button>
    </div>

    <!-- Site Configuration -->
    <div class="section-card">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg> Site Configuration</h3>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Min Deposit (₦)</label>
          <input type="number" class="form-input" id="minDeposit" />
          <div class="current-value" id="currentMinDeposit"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Min Withdrawal (₦)</label>
          <input type="number" class="form-input" id="minWithdrawal" />
          <div class="current-value" id="currentMinWithdrawal"></div>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Withdrawal Fee (%)</label>
          <input type="number" class="form-input" id="withdrawalFee" />
          <div class="current-value" id="currentWithdrawalFee"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Referral Level 1 (%)</label>
          <input type="number" class="form-input" id="refL1" />
          <div class="current-value" id="currentRefL1"></div>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Referral Level 2 (%)</label>
          <input type="number" class="form-input" id="refL2" />
          <div class="current-value" id="currentRefL2"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Referral Level 3 (%)</label>
          <input type="number" class="form-input" id="refL3" />
          <div class="current-value" id="currentRefL3"></div>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Withdrawal Hours</label>
        <div class="form-inline">
          <input type="number" class="form-input" id="withdrawalStart" placeholder="8" min="0" max="23" />
          <span>AM to</span>
          <input type="number" class="form-input" id="withdrawalEnd" placeholder="17" min="0" max="23" />
          <span>PM (Mon-Sat, Closed Sunday)</span>
        </div>
        <div class="current-value" id="currentWithdrawalHours"></div>
      </div>
      
      <button class="save-btn" onclick="saveSiteConfig()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg>
        Save Configuration
      </button>
    </div>

  </div>
</main>

<!-- Toast -->
<div class="toast success" id="toast"><div class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><div class="toast-content"><h4>Success</h4><p id="toastMsg"></p></div></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyDT0ACobk5YMFgrqxb-VOnfELXTyssrOtA", authDomain: "newpro-d830e.firebaseapp.com", projectId: "newpro-d830e", storageBucket: "newpro-d830e.firebasestorage.app", messagingSenderId: "642315724384", appId: "1:642315724384:web:19def936898718e9300505" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toastMsg').textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function formatNaira(a) { return '₦' + Number(a).toLocaleString('en-NG'); }

  window.handleLogout = async () => { await signOut(auth); window.location.href = 'admin-login.html'; };

  // Load all settings
  async function loadSettings() {
    try {
      // Bank details
      const bankSnap = await getDoc(doc(db, 'settings', 'bankDetails'));
      if(bankSnap.exists()) {
        const b = bankSnap.data();
        document.getElementById('bankName').value = b.bankName || '';
        document.getElementById('accountNumber').value = b.accountNumber || '';
        document.getElementById('accountName').value = b.accountName || '';
        document.getElementById('currentBankName').textContent = b.bankName ? 'Current: ' + b.bankName : '';
        document.getElementById('currentAccountNumber').textContent = b.accountNumber ? 'Current: ' + b.accountNumber : '';
        document.getElementById('currentAccountName').textContent = b.accountName ? 'Current: ' + b.accountName : '';
      }

      // Site config
      const configSnap = await getDoc(doc(db, 'settings', 'siteConfig'));
      if(configSnap.exists()) {
        const c = configSnap.data();
        document.getElementById('minDeposit').value = c.minDeposit || '';
        document.getElementById('minWithdrawal').value = c.minWithdrawal || '';
        document.getElementById('withdrawalFee').value = c.withdrawalFee || '';
        document.getElementById('refL1').value = c.refL1 || '';
        document.getElementById('refL2').value = c.refL2 || '';
        document.getElementById('refL3').value = c.refL3 || '';
        document.getElementById('withdrawalStart').value = c.withdrawalStart || '';
        document.getElementById('withdrawalEnd').value = c.withdrawalEnd || '';

        document.getElementById('currentMinDeposit').textContent = c.minDeposit ? 'Current: ' + formatNaira(c.minDeposit) : '';
        document.getElementById('currentMinWithdrawal').textContent = c.minWithdrawal ? 'Current: ' + formatNaira(c.minWithdrawal) : '';
        document.getElementById('currentWithdrawalFee').textContent = c.withdrawalFee ? 'Current: ' + c.withdrawalFee + '%' : '';
        document.getElementById('currentRefL1').textContent = c.refL1 ? 'Current: ' + c.refL1 + '%' : '';
        document.getElementById('currentRefL2').textContent = c.refL2 ? 'Current: ' + c.refL2 + '%' : '';
        document.getElementById('currentRefL3').textContent = c.refL3 ? 'Current: ' + c.refL3 + '%' : '';
        document.getElementById('currentWithdrawalHours').textContent = (c.withdrawalStart && c.withdrawalEnd) ? `Current: ${c.withdrawalStart}:00 AM - ${c.withdrawalEnd}:00 PM` : '';
      }
    } catch(e) { console.error('Error loading settings:', e); }
  }

  // Save bank details
  window.saveBankDetails = async () => {
    const bankName = document.getElementById('bankName').value.trim();
    const accountNumber = document.getElementById('accountNumber').value.trim();
    const accountName = document.getElementById('accountName').value.trim();

    if(!bankName || !accountNumber || !accountName) { showToast('Please fill all bank fields'); return; }

    try {
      await setDoc(doc(db, 'settings', 'bankDetails'), {
        bankName, accountNumber, accountName, updatedAt: serverTimestamp()
      }, { merge: true });

      document.getElementById('currentBankName').textContent = 'Current: ' + bankName;
      document.getElementById('currentAccountNumber').textContent = 'Current: ' + accountNumber;
      document.getElementById('currentAccountName').textContent = 'Current: ' + accountName;
      showToast('Bank details saved! These will appear on the deposit page.');
    } catch(e) { showToast('Error saving bank details'); }
  };

  // Save site config
  window.saveSiteConfig = async () => {
    const minDeposit = Number(document.getElementById('minDeposit').value);
    const minWithdrawal = Number(document.getElementById('minWithdrawal').value);
    const withdrawalFee = Number(document.getElementById('withdrawalFee').value);
    const refL1 = Number(document.getElementById('refL1').value);
    const refL2 = Number(document.getElementById('refL2').value);
    const refL3 = Number(document.getElementById('refL3').value);
    const withdrawalStart = Number(document.getElementById('withdrawalStart').value);
    const withdrawalEnd = Number(document.getElementById('withdrawalEnd').value);

    try {
      await setDoc(doc(db, 'settings', 'siteConfig'), {
        minDeposit, minWithdrawal, withdrawalFee, refL1, refL2, refL3,
        withdrawalStart, withdrawalEnd,
        updatedAt: serverTimestamp()
      }, { merge: true });

      document.getElementById('currentMinDeposit').textContent = 'Current: ' + formatNaira(minDeposit);
      document.getElementById('currentMinWithdrawal').textContent = 'Current: ' + formatNaira(minWithdrawal);
      document.getElementById('currentWithdrawalFee').textContent = 'Current: ' + withdrawalFee + '%';
      document.getElementById('currentRefL1').textContent = 'Current: ' + refL1 + '%';
      document.getElementById('currentRefL2').textContent = 'Current: ' + refL2 + '%';
      document.getElementById('currentRefL3').textContent = 'Current: ' + refL3 + '%';
      document.getElementById('currentWithdrawalHours').textContent = `Current: ${withdrawalStart}:00 AM - ${withdrawalEnd}:00 PM`;
      showToast('Site configuration saved!');
    } catch(e) { showToast('Error saving configuration'); }
  };

  onAuthStateChanged(auth, async (user) => {
    if(user) {
      const ad = await getDoc(doc(db, 'adminUsers', user.uid));
      if(ad.exists() && ad.data().role === 'admin') {
        loadSettings();
      } else {
        window.location.href = 'admin-login.html';
      }
    } else {
      window.location.href = 'admin-login.html';
    }
  });
</script>
</body>
</html>

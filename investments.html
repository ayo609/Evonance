<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Evonance – Investments</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060b14; --surface: #0b1120; --elevated: #111b2e; --elevated-hover: #162032;
      --primary: #10b981; --primary-glow: #34d399; --primary-muted: rgba(16,185,129,0.08);
      --gold: #f0b90b; --gold-muted: rgba(240,185,11,0.08);
      --text: #e8edf5; --text-secondary: #8896b4; --text-muted: #5a6988;
      --border-subtle: rgba(255,255,255,0.03); --border-soft: rgba(255,255,255,0.07);
      --border-glow: rgba(16,185,129,0.25); --success: #10b981; --error: #ef4444;
      --warning: #f59e0b; --info: #3b82f6; --purple: #8b5cf6;
      --radius-sm: 10px; --radius-md: 16px; --radius-lg: 22px; --radius-xl: 28px;
      --shadow-elevated: 0 4px 24px rgba(0,0,0,0.3);
    }

    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); padding-bottom: 90px; position: relative; }
    #ambientCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .topbar { position: sticky; top: 0; z-index: 100; background: rgba(11,17,32,0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid var(--border-subtle); padding: 0 20px; }
    .topbar-inner { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; height: 58px; gap: 14px; }
    .back-btn { background: var(--elevated); border: 1px solid var(--border-soft); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); text-decoration: none; transition: all 0.25s; flex-shrink: 0; }
    .back-btn:hover { border-color: var(--border-glow); color: var(--primary); }
    .back-btn svg { width: 17px; height: 17px; }
    .topbar-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; flex: 1; }
    .balance-chip { display: flex; align-items: center; gap: 6px; background: var(--primary-muted); border: 1px solid rgba(16,185,129,0.2); border-radius: 50px; padding: 7px 14px; font-size: 0.75rem; font-weight: 700; color: var(--primary-glow); white-space: nowrap; }
    .balance-chip svg { width: 13px; height: 13px; }

    .main-layout { max-width: 1000px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1; }
    .info-strip { background: var(--surface); border: 1px solid rgba(16,185,129,0.15); border-radius: var(--radius-lg); padding: 13px 18px; display: flex; align-items: center; gap: 10px; font-size: 0.78rem; color: var(--text-secondary); box-shadow: var(--shadow-elevated); }
    .info-strip svg { width: 18px; height: 18px; color: var(--primary-glow); flex-shrink: 0; }
    .info-strip strong { color: var(--primary-glow); }

    .tab-bar { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 50px; padding: 5px; overflow-x: auto; box-shadow: var(--shadow-elevated); }
    .tab-pill { flex: 1; padding: 11px 16px; border: none; background: transparent; color: var(--text-muted); font-family: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; border-radius: 50px; transition: all 0.3s; text-align: center; white-space: nowrap; }
    .tab-pill.active { background: var(--primary); color: #fff; box-shadow: 0 4px 16px rgba(16,185,129,0.3); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .plans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .plan-card { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 22px 20px; position: relative; transition: all 0.3s; display: flex; flex-direction: column; box-shadow: var(--shadow-elevated); }
    .plan-card:hover { border-color: var(--border-glow); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(16,185,129,0.08); }
    .plan-card.featured { border-color: rgba(240,185,11,0.3); }
    .plan-card.vip-card { border-color: rgba(139,92,246,0.3); }
    .plan-card.sold-out { opacity: 0.55; pointer-events: none; }
    .plan-badge { position: absolute; top: 14px; right: 14px; font-size: 0.6rem; font-weight: 800; padding: 5px 10px; border-radius: 50px; text-transform: uppercase; letter-spacing: 0.5px; }
    .plan-badge.popular { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #000; }
    .plan-badge.limited { background: linear-gradient(135deg, #ef4444, #f87171); color: #fff; }
    .plan-badge.vip-badge { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; }
    .plan-icon-wrap { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 12px; }
    .plan-icon-wrap.bronze { background: rgba(205,127,50,0.15); }
    .plan-icon-wrap.silver { background: rgba(192,192,192,0.12); }
    .plan-icon-wrap.gold { background: rgba(255,215,0,0.12); }
    .plan-icon-wrap.platinum { background: rgba(16,185,129,0.12); }
    .plan-icon-wrap.diamond { background: rgba(59,130,246,0.12); }
    .plan-icon-wrap.vip { background: rgba(139,92,246,0.12); }

    .plan-icon-wrap.legend { background: rgba(239,68,68,0.12); }
    .plan-icon-wrap.ultimate { background: rgba(236,72,153,0.12); }
    .plan-name { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.3px; }
    .plan-details { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; flex: 1; }
    .plan-detail-row { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--text-muted); padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .plan-detail-row:last-child { border-bottom: none; }
    .plan-detail-row span:last-child { font-weight: 600; color: var(--text); }

    .slot-tags { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .slot-tag { font-size: 0.66rem; font-weight: 600; padding: 5px 10px; border-radius: 6px; text-align: center; }
    .slot-tag.global-tag { color: #fbbf24; background: rgba(245,158,11,0.06); }
    .slot-tag.peruser-tag { color: #60a5fa; background: rgba(59,130,246,0.06); }

    .invest-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary), #059669); color: #fff; border: none; border-radius: 50px; font-family: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.3s; letter-spacing: 0.3px; position: relative; overflow: hidden; }
    .invest-btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent); transform: translateX(-100%); transition: transform 0.5s; }

    .bottom-nav { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 100; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 50px; display: flex; align-items: center; padding: 6px 8px; gap: 2px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); backdrop-filter: blur(20px); }
    .nav-item { display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 50px; text-decoration: none; color: var(--text-muted); font-size: 0.7rem; font-weight: 600; transition: all 0.3s; white-space: nowrap; }
    .nav-item.active { background: var(--primary); color: #fff; box-shadow: 0 4px 16px rgba(16,185,129,0.3); }
    .nav-item:hover:not(.active) { color: var(--text); background: var(--elevated); }

    .toast-overlay { position: fixed; top: 20px; left: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast-item { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 14px 18px; display: flex; align-items: center; gap: 10px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); transform: translateX(-120%); transition: transform 0.5s cubic-bezier(0.22,0.61,0.36,1); pointer-events: auto; max-width: 380px; }
    .toast-item.show { transform: translateX(0); }
    .toast-item.success { border-left: 3px solid var(--success); }

    .toast-icon-wrap { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast-item.success .toast-icon-wrap { background: rgba(16,185,129,0.12); }
    .toast-item.error .toast-icon-wrap { background: rgba(239,68,68,0.12); }
    .toast-icon-wrap svg { width: 17px; height: 17px; color: var(--success); }

    .toast-text h4 { font-size: 0.85rem; font-weight: 700; }

    @media (max-width: 600px) {
      .plans-grid { grid-template-columns: 1fr; }

      .nav-item { padding: 8px 10px; font-size: 0.6rem; gap: 3px; }
      .nav-item svg { width: 15px; height: 15px; }
    }
  </style>
</head>

<script>
  (function(){
    const c=document.getElementById('ambientCanvas'),ctx=c.getContext('2d');let w,h,pts=[];
    function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;}
    resize();window.addEventListener('resize',resize);
    class Pt{
      constructor(){this.reset();}
      reset(){this.x=Math.random()*w;this.y=Math.random()*h;this.s=Math.random()*1.2+0.4;this.sx=(Math.random()-0.5)*0.2;this.sy=(Math.random()-0.5)*0.2;this.o=Math.random()*0.3+0.06;this.ps=Math.random()*0.015+0.004;this.po=Math.random()*Math.PI*2;this.h=Math.random()<0.5?160:(Math.random()<0.5?45:220);}
      update(){this.x+=this.sx;this.y+=this.sy;if(this.x<-10)this.x=w+10;if(this.x>w+10)this.x=-10;if(this.y<-10)this.y=h+10;if(this.y>h+10)this.y=-10;}
      draw(){const p=Math.sin(Date.now()*this.ps+this.po)*0.3+0.7,a=this.o*p;ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,Math.PI*2);ctx.fillStyle=`hsla(${this.h},65%,50%,${a})`;ctx.fill();}
    }
    for(let i=0;i<60;i++)pts.push(new Pt());
    function anim(){ctx.clearRect(0,0,w,h);pts.forEach(p=>{p.update();p.draw();});
      for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<100){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(16,185,129,${0.022*(1-d/100)})`;ctx.lineWidth=0.35;ctx.stroke();}}}
      requestAnimationFrame(anim);}
    anim();
  })();
</script>

  function showToast(type, title, msg, d = 4000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast-item ${type}`;
    const iconSvg = type === 'error'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
    toast.innerHTML = `<div class="toast-icon-wrap">${iconSvg}</div><div class="toast-text"><h4>${title}</h4><p>${msg}</p></div>`;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, d);

  function formatDateTime(ts) { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('en-NG', { year: 'numeric', month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' }); }

  async function getStandardPlansWithOverrides() {
    let plans = DEFAULT_STANDARD_PLANS.map(p => ({ ...p }));
    try {
      const snap = await getDoc(doc(db, 'planSettings', 'standardPlanValues'));
      if (snap.exists()) {
        const overrides = snap.data();
        plans = plans.map(p => {
          const key = 'plan_' + p.id;
          if (overrides[key]) {
            const o = overrides[key];
            const invest = o.invest ?? p.invest;
            const profit = o.profit ?? p.profit;
            const days = o.days ?? p.days;
            return { ...p, name: o.name || p.name, emoji: o.emoji || p.emoji, invest, profit, days, total: invest + profit };
          }
          return p;
        });
      }
    } catch (e) { /* silent */ }
    return plans;
  }

  async function getPlanSettings() {
    try { const snap = await getDoc(doc(db, 'planSettings', 'quantities')); return snap.exists() ? snap.data() : {}; } catch (e) { return {}; }
  }

  async function getUserPurchaseCount(planId, planType) {
    if (!currentUser) return 0;

      const q = query(collection(db, 'investments'), where('uid', '==', currentUser.uid), where('planId', '==', String(planId)), where('planType', '==', planType));
      const snap = await getDocs(q);
      return snap.size;
    } catch (e) { return 0; }

  async function renderPlans() {
    const [plans, settings] = await Promise.all([getStandardPlansWithOverrides(), getPlanSettings()]);
    const userCounts = {};
    if (currentUser) {
      const q = query(collection(db, 'investments'), where('uid', '==', currentUser.uid), where('planType', '==', 'standard'));
      const snap = await getDocs(q);
      snap.forEach(d => { const inv = d.data(); userCounts[inv.planId] = (userCounts[inv.planId] || 0) + 1; });
    }
    document.getElementById('plansGrid').innerHTML = plans.map(p => {
      const maxQty = settings['plan_' + p.id] ?? null;
      const perUserLimit = settings['plan_' + p.id + '_perUser'] ?? null;
      const sold = settings['plan_' + p.id + '_sold'] ?? 0;
      const userCount = userCounts[String(p.id)] || 0;
      const hasGlobal = maxQty !== null && maxQty > 0;
      const hasPerUser = perUserLimit !== null && perUserLimit > 0;
      const globalRem = hasGlobal ? maxQty - sold : -1;
      const globalOut = hasGlobal && globalRem <= 0;
      const userRem = hasPerUser ? perUserLimit - userCount : -1;
      const userOut = hasPerUser && userRem <= 0;
      const fullyOut = globalOut || userOut;
      let tags = '';

  // ===== OPEN CONFIRM MODAL (CRASH-PROOF) =====
  window.openConfirmModal = async function(planId, type) {
    try {
      // Always build a safe fallback first
      let name = 'Investment Plan', invest = 0, profit = 0, days = 0, total = 0, maxQty = null, sold = 0, perUserLimit = null;
      let userCount = 0;

      if (type === 'limited') {
        const snap = await getDoc(doc(db, 'limitedPlans', String(planId)));
        if (snap.exists()) {
          const d = snap.data();
          name = d.name || 'Limited Plan';
          invest = Number(d.invest) || 0;
          profit = Number(d.profit) || 0;
          days = Number(d.days) || 0;
          total = Number(d.total) || (invest + profit);
          maxQty = d.maxQty || null;
          sold = d.sold || 0;
          perUserLimit = d.perUserLimit || null;
        }
        userCount = await getUserPurchaseCount(String(planId), 'limited');
      } else if (type === 'vip') {
        const snap = await getDoc(doc(db, 'vipPlans', String(planId)));
        if (snap.exists()) {
          const d = snap.data();
          name = d.name || 'VIP Plan';
          invest = Number(d.invest) || 0;
          profit = Number(d.profit) || 0;
          days = Number(d.days) || 0;
          total = Number(d.total) || (invest + profit);
          maxQty = d.maxQty || null;
          sold = d.sold || 0;
          perUserLimit = d.perUserLimit || null;
        }
        userCount = await getUserPurchaseCount(String(planId), 'vip');
      } else {
        const [plans, settings] = await Promise.all([getStandardPlansWithOverrides(), getPlanSettings()]);
        const p = plans.find(x => x.id === planId);
        if (p) {
          name = p.name;
          invest = p.invest;
          profit = p.profit;
          days = p.days;
          total = p.total;
          maxQty = settings['plan_' + p.id] ?? null;
          sold = settings['plan_' + p.id + '_sold'] ?? 0;
          perUserLimit = settings['plan_' + p.id + '_perUser'] ?? null;
        }
        userCount = await getUserPurchaseCount(String(planId), 'standard');
      }

      // Build selectedPlanData safely — NEVER null
      selectedPlanData = { id: planId, name, invest, profit, days, total, type, maxQty, sold, perUserLimit, userCount };
      showModal();
    } catch (e) {
      console.error('Modal error:', e);
      showToast('error', 'Error', 'Unable to load plan. Please try again.');
    }
  };

  function showModal() {
    if (!selectedPlanData) return;
    const perUserInfo = selectedPlanData.perUserLimit ? `${selectedPlanData.userCount} of ${selectedPlanData.perUserLimit} used` : 'No limit';
    document.getElementById('modalDetails').innerHTML = `
      <div class="modal-info-row"><span>Plan</span><span>${selectedPlanData.name}</span></div>
      <div class="modal-info-row"><span>Investment</span><span>${formatNaira(selectedPlanData.invest)}</span></div>
      <div class="modal-info-row"><span>Profit</span><span style="color:var(--success);">${formatNaira(selectedPlanData.profit)}</span></div>
      <div class="modal-info-row"><span>Duration</span><span>${selectedPlanData.days} Days</span></div>
      <div class="modal-info-row"><span>Total Return</span><span style="color:var(--success);">${formatNaira(selectedPlanData.total)}</span></div>
      <div class="modal-info-row"><span>Your Purchases</span><span style="color:var(--info);">${perUserInfo}</span></div>

  window.closeConfirmModal = function() { document.getElementById('confirmModal').classList.remove('show'); selectedPlanData = null; };

  window.confirmInvestment = async function() {
    if (!currentUser || !selectedPlanData) return;
    const btn = document.getElementById('confirmBtn'), sp = document.getElementById('confirmSpinner'), tx = document.getElementById('confirmText');
    btn.disabled = true; sp.style.display = 'block'; tx.textContent = 'Processing...';

    // Capture everything we still need BEFORE closeConfirmModal() wipes selectedPlanData to null.
    // (This was the bug: the code used to read selectedPlanData.name/.type AFTER nulling it out,
    // which crashed with "Cannot read properties of null" even though the purchase had already
    // gone through — so it showed "Failed" on a successful investment.)
    const planName = selectedPlanData.name;
    const planType = selectedPlanData.type;

    try {
      const userRef = doc(db, 'users', currentUser.uid), userSnap = await getDoc(userRef);
      if (!userSnap.exists()) throw new Error('User not found');
      const bal = Number(userSnap.data().depositWallet) || 0, amt = Number(selectedPlanData.invest);
      if (bal < amt) { showToast('error', 'Insufficient Balance', `Need ${formatNaira(amt)}.`); closeConfirmModal(); return; }
      if (selectedPlanData.maxQty !== null && selectedPlanData.maxQty > 0) {
        if ((selectedPlanData.maxQty - (selectedPlanData.sold || 0)) <= 0) { showToast('error', 'Sold Out', 'All global slots taken.'); closeConfirmModal(); return; }
      }
      if (selectedPlanData.perUserLimit !== null && selectedPlanData.perUserLimit > 0) {
        const uc = await getUserPurchaseCount(selectedPlanData.id, selectedPlanData.type);
        if (uc >= selectedPlanData.perUserLimit) { showToast('error', 'Limit Reached', `Max ${selectedPlanData.perUserLimit} purchases.`); closeConfirmModal(); return; }
      }
      if (selectedPlanData.maxQty !== null && selectedPlanData.maxQty > 0) {
        if (selectedPlanData.type === 'standard') await updateDoc(doc(db, 'planSettings', 'quantities'), { ['plan_' + selectedPlanData.id + '_sold']: increment(1) });
        else { const coll = selectedPlanData.type === 'limited' ? 'limitedPlans' : 'vipPlans'; await updateDoc(doc(db, coll, String(selectedPlanData.id)), { sold: increment(1) }); }
      }
      await updateDoc(userRef, { depositWallet: increment(-amt) });
      const invRef = doc(collection(db, 'investments'));
      await setDoc(invRef, { uid: currentUser.uid, planId: String(selectedPlanData.id), planName: selectedPlanData.name, planType: selectedPlanData.type, amount: amt, totalProfit: Number(selectedPlanData.profit), totalReturn: Number(selectedPlanData.total), totalDays: Number(selectedPlanData.days), daysElapsed: 0, quantity: 1, status: 'active', createdAt: serverTimestamp(), completedAt: null, roiCredited: false });
      await updateDoc(userRef, { activeInvestments: increment(1) });
      await addDoc(collection(db, 'transactions'), { uid: currentUser.uid, type: 'investment', amount: amt, planName: selectedPlanData.name, status: 'completed', createdAt: serverTimestamp(), description: `Investment in ${selectedPlanData.name}` });
      await processReferralCommissions(currentUser.uid, amt, selectedPlanData.name);

      closeConfirmModal();
      showToast('success', 'Investment Successful! 🎉', `Invested ${formatNaira(amt)} in ${planName}.`);
      updateHeaderBalance();
      document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-pill')[3].classList.add('active');
      document.getElementById('tab-myInvestments').classList.add('active');
      loadMyInvestments();
      if (planType === 'standard') renderPlans();
      else if (planType === 'limited') loadLimitedOrVipPlans('limitedPlans', 'limitedPlansGrid');
      else loadLimitedOrVipPlans('vipPlans', 'vipPlansGrid');
    } catch (e) {
      console.error(e);
      showToast('error', 'Failed', e.message || 'Something went wrong.');
    }
    finally { btn.disabled = false; sp.style.display = 'none'; tx.textContent = 'Confirm (1 Slot)'; }
  };

  async function processReferralCommissions(uid, amt, planName) {
    try {
      const us = await getDoc(doc(db, 'users', uid)); if (!us.exists()) return;
      const refBy = us.data().referredBy; if (!refBy) return;
      const l1Snap = await getDoc(doc(db, 'users', refBy));
      if (l1Snap.exists()) {
        const l1Com = Math.round(amt * 0.10);
        await updateDoc(doc(db, 'users', refBy), { withdrawalWallet: increment(l1Com), referralEarnings: increment(l1Com) });
        await addDoc(collection(db, 'notifications'), { uid: refBy, title: '💰 Referral Bonus!', message: `Downline invested ${formatNaira(amt)} in ${planName}. Earned ${formatNaira(l1Com)} (L1-10%).`, type: 'referral_commission', amount: l1Com, level: 1, read: false, createdAt: serverTimestamp() });
        const l2Uid = l1Snap.data().referredBy;
        if (l2Uid) { const l2Snap = await getDoc(doc(db, 'users', l2Uid)); if (l2Snap.exists()) { const l2Com = Math.round(amt * 0.02); await updateDoc(doc(db, 'users', l2Uid), { withdrawalWallet: increment(l2Com), referralEarnings: increment(l2Com) }); await addDoc(collection(db, 'notifications'), { uid: l2Uid, title: '💰 Referral Bonus!', message: `L2 downline invested ${formatNaira(amt)}. Earned ${formatNaira(l2Com)} (L2-2%).`, type: 'referral_commission', amount: l2Com, level: 2, read: false, createdAt: serverTimestamp() });
          const l3Uid = l2Snap.data().referredBy; if (l3Uid) { const l3Snap = await getDoc(doc(db, 'users', l3Uid)); if (l3Snap.exists()) { const l3Com = Math.round(amt * 0.01); await updateDoc(doc(db, 'users', l3Uid), { withdrawalWallet: increment(l3Com), referralEarnings: increment(l3Com) }); await addDoc(collection(db, 'notifications'), { uid: l3Uid, title: '💰 Referral Bonus!', message: `L3 downline invested ${formatNaira(amt)}. Earned ${formatNaira(l3Com)} (L3-1%).`, type: 'referral_commission', amount: l3Com, level: 3, read: false, createdAt: serverTimestamp() }); } } } }
      }
    } catch (e) {
      // Was previously silent — now logged so a broken referral chain (e.g. a Firestore
      // rules rejection when updating another user's wallet) is visible instead of invisible.
      console.error('Referral commission error:', e);
    }
  }

  async function updateHeaderBalance() {
    if (!currentUser) return;
    try { const s = await getDoc(doc(db, 'users', currentUser.uid)); if (s.exists()) { const bal = s.data().depositWallet || 0; document.getElementById('headerBalance').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> ${formatNaira(bal)}`; } } catch (e) {}
  }

  onAuthStateChanged(auth, (u) => { if (u) { currentUser = u; renderPlans(); updateHeaderBalance(); } else window.location.href = 'login.html'; });
</script>
</body>
</html>

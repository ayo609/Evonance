<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Processing - Evonance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
      padding: 20px;
      text-align: center;
    }
    .container {
      background: rgba(17, 25, 40, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .loader {
      width: 56px; height: 56px;
      border: 4px solid #1e293b;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon { font-size: 4rem; margin-bottom: 16px; }
    h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
    p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
    .reference { 
      background: rgba(16, 185, 129, 0.08); 
      border: 1px solid rgba(16, 185, 129, 0.2); 
      border-radius: 12px; 
      padding: 10px 16px; 
      font-size: 0.8rem; 
      color: #34d399; 
      margin-bottom: 16px;
      word-break: break-all;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4); }
    .btn-secondary {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      margin-left: 10px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .status-badge.success { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .status-badge.failed { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .status-badge.pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
  </style>
</head>
<body>

<div class="container">
  <div class="loader" id="loader"></div>
  <div class="icon" id="statusIcon">⏳</div>
  <span class="status-badge pending" id="statusBadge">Processing</span>
  <h2 id="statusTitle">Processing Payment...</h2>
  <p id="statusMessage">Please wait while we confirm your payment.</p>
  <div class="reference" id="referenceDisplay" style="display:none;"></div>
  <div>
    <button class="btn btn-primary" id="actionBtn" onclick="goToTransactions()" style="display:none;">📋 View Transactions</button>
    <button class="btn btn-secondary" id="retryBtn" onclick="goToDeposit()" style="display:none;">🔄 Try Again</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, updateDoc, collection, query, where, getDocs, addDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDT0ACobk5YMFgrqxb-VOnfELXTyssrOtA",
    authDomain: "newpro-d830e.firebaseapp.com",
    projectId: "newpro-d830e",
    storageBucket: "newpro-d830e.firebasestorage.app",
    messagingSenderId: "642315724384",
    appId: "1:642315724384:web:19def936898718e9300505"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function showResult(icon, badgeClass, badgeText, title, message, showTransactions, showRetry) {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('statusIcon').textContent = icon;
    document.getElementById('statusBadge').className = 'status-badge ' + badgeClass;
    document.getElementById('statusBadge').textContent = badgeText;
    document.getElementById('statusTitle').textContent = title;
    document.getElementById('statusMessage').textContent = message;
    if (showTransactions) document.getElementById('actionBtn').style.display = 'inline-block';
    if (showRetry) document.getElementById('retryBtn').style.display = 'inline-block';
  }

  window.goToTransactions = function() { window.location.href = 'transactions.html'; };
  window.goToDeposit = function() { window.location.href = 'deposit.html'; };

  async function verifyPayment() {
    const urlParams = new URLSearchParams(window.location.search);
    
    // Support BOTH old and new NekPayment parameter formats
    const reference = urlParams.get('mchOrderNo') || urlParams.get('merTransferId') || urlParams.get('order_id') || urlParams.get('reference') || urlParams.get('tx_ref');
    const tradeResult = urlParams.get('tradeResult');
    const respCode = urlParams.get('respCode');
    const status = urlParams.get('status') || urlParams.get('respcode');
    const tradeNo = urlParams.get('tradeNo') || urlParams.get('orderNo');
    const amount = urlParams.get('tradeAmount') || urlParams.get('transferAmount') || urlParams.get('oriAmount');
    
    console.log('Callback params:', { reference, tradeResult, respCode, status, tradeNo, amount });

    if (!reference) {
      showResult('⚠️', 'pending', 'Unknown', 'No Reference Found', 
        'Could not identify your payment. Please check your transactions page.', true, false);
      return;
    }

    document.getElementById('referenceDisplay').textContent = 'Ref: ' + reference;
    document.getElementById('referenceDisplay').style.display = 'block';

    // Try to find the deposit record
    const depositQuery = query(collection(db, 'deposits'), where('reference', '==', reference));
    const snapshot = await getDocs(depositQuery);
    let depositDoc = null, depositData = null;
    
    if (!snapshot.empty) {
      depositDoc = snapshot.docs[0];
      depositData = depositDoc.data();
    }

    // Check if payment is successful using NekPayment's callback parameters
    const isSuccess = tradeResult === '1' || respCode === 'SUCCESS' || status === '00' || status === 'success';

    if (isSuccess && depositDoc) {
      try {
        // Payment confirmed - credit wallet
        const creditAmount = amount ? (parseFloat(amount)) : depositData.amount;

        await updateDoc(doc(db, 'deposits', depositDoc.id), {
          status: 'confirmed',
          confirmedAt: serverTimestamp(),
          walletCredited: true,
          tradeNo: tradeNo || '',
          paymentData: { tradeResult, respCode, tradeNo, amount }
        });

        await updateDoc(doc(db, 'users', depositData.uid), {
          depositWallet: increment(creditAmount),
          totalDeposits: increment(creditAmount)
        });

        // Update transaction
        const txQuery = query(collection(db, 'transactions'), where('reference', '==', reference));
        const txSnap = await getDocs(txQuery);
        if (!txSnap.empty) {
          await updateDoc(doc(db, 'transactions', txSnap.docs[0].id), { status: 'completed' });
        }

        // Notify user
        await addDoc(collection(db, 'notifications'), {
          uid: depositData.uid,
          title: '✅ Deposit Confirmed!',
          message: `Your deposit of ₦${creditAmount.toLocaleString()} has been credited to your wallet.`,
          type: 'deposit',
          read: false,
          createdAt: serverTimestamp()
        });

        showResult('✅', 'success', 'Confirmed', 'Payment Confirmed! 🎉', 
          `Your deposit of ₦${creditAmount.toLocaleString()} has been credited to your wallet.`, true, false);

        setTimeout(() => window.location.href = 'transactions.html', 3000);

      } catch (error) {
        console.error('Credit error:', error);
        showResult('✅', 'success', 'Completed', 'Payment Completed!', 
          'Your payment was successful. Wallet will be credited shortly.', true, false);
      }

    } else if (isSuccess && !depositDoc) {
      // Payment successful but no deposit record found
      showResult('✅', 'success', 'Received', 'Payment Received!', 
        'Your payment was successful. If not credited, please contact support with ref: ' + reference, true, false);

    } else if (tradeResult === '0' || respCode === 'FAIL') {
      // Payment failed
      showResult('❌', 'failed', 'Failed', 'Payment Failed', 
        'Your payment was not successful. Please try again.', false, true);

    } else {
      // Unknown status - show success since NekPayment redirected here
      if (depositDoc) {
        showResult('✅', 'success', 'Completed', 'Payment Completed!', 
          'Your payment has been received. Admin will verify and credit your wallet shortly.', true, false);
      } else {
        showResult('⏳', 'pending', 'Processing', 'Payment Processing', 
          'Your payment is being processed. Check your transactions for updates.', true, false);
      }
    }
  }

  verifyPayment();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Evonance – Admin Investments</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e17; --card: #111827; --card-hover: #1a2332;
      --primary: #f59e0b; --primary-dark: #d97706; --primary-soft: rgba(245, 158, 11, 0.1);
      --accent: #fbbf24; --text: #f1f5f9; --muted: #94a3b8; --border: #1e293b;
      --input-bg: #0f172a; --success: #10b981; --error: #ef4444; --warning: #f59e0b; --info: #3b82f6; --purple: #8b5cf6;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); display: flex; }
    
    .sidebar { width: 260px; min-height: 100vh; background: var(--card); border-right: 1px solid var(--border); padding: 20px 0; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .sidebar-logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), #fbbf24); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .sidebar-logo-icon svg { width: 20px; height: 20px; color: #1a1a1a; }
    .sidebar-brand { font-size: 1.1rem; font-weight: 800; color: var(--text); }
    .sidebar-brand span { color: var(--primary); }
    .sidebar-nav { flex: 1; padding: 0 12px; }
    .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; margin-bottom: 4px; }
    .sidebar-link:hover { background: var(--card-hover); color: var(--text); }
    .sidebar-link.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
    .sidebar-link svg { width: 20px; height: 20px; flex-shrink: 0; }
    .sidebar-footer { padding: 16px 20px 0; border-top: 1px solid var(--border); margin-top: auto; }
    .sidebar-user { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .sidebar-avatar { width: 36px; height: 36px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: #1a1a1a; }
    .sidebar-user-info { flex: 1; min-width: 0; }
    .sidebar-user-name { font-size: 0.8rem; font-weight: 600; }
    .sidebar-user-role { font-size: 0.68rem; color: var(--primary); }
    .sidebar-logout { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; color: #fca5a5; cursor: pointer; font-size: 0.82rem; font-weight: 500; transition: all 0.2s; background: none; border: none; width: 100%; font-family: inherit; }
    .sidebar-logout:hover { background: rgba(239, 68, 68, 0.1); }
    .sidebar-logout svg { width: 18px; height: 18px; }
    
    .main-content { flex: 1; margin-left: 260px; padding: 24px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
    
    .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px 16px; border: none; background: transparent; color: var(--muted); font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 12px; transition: all 0.3s; text-align: center; }
    .tab-btn.active { background: var(--primary); color: #1a1a1a; }
    .tab-btn:hover:not(.active) { background: var(--card-hover); color: var(--text); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .plans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .plan-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .plan-card h4 { font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .plan-card h4 span { font-size: 1.5rem; }
    .plan-detail { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.8rem; border-bottom: 1px solid var(--border); }
    .plan-detail:last-child { border-bottom: none; }
    .plan-detail span:first-child { color: var(--muted); }
    .plan-detail span:last-child { font-weight: 600; }
    .plan-actions { display: flex; gap: 8px; margin-top: 12px; }
    .action-btn { flex: 1; padding: 8px; border-radius: 8px; font-family: inherit; font-size: 0.72rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .action-btn.edit { background: var(--info); color: white; }
    .action-btn.toggle { background: var(--warning); color: #1a1a1a; }
    .action-btn.toggle.off { background: var(--error); color: white; }
    .action-btn.delete { background: var(--error); color: white; }
    .action-btn:hover { opacity: 0.8; }
    
    .investments-table { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .table-header { display: grid; grid-template-columns: 1.5fr 1.5fr 1fr 1fr 1fr 1fr 1.5fr; padding: 14px 16px; background: var(--input-bg); font-size: 0.7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .table-row { display: grid; grid-template-columns: 1.5fr 1.5fr 1fr 1fr 1fr 1fr 1.5fr; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 0.78rem; align-items: center; }
    .table-row:last-child { border-bottom: none; }
    .table-row:hover { background: var(--card-hover); }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 50px; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; }
    .status-badge.active { background: rgba(16,185,129,0.15); color: var(--success); }
    .status-badge.completed { background: rgba(59,130,246,0.15); color: var(--info); }
    
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 1.1rem; margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .form-input { width: 100%; height: 46px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 0.9rem; color: var(--text); outline: none; }
    .form-input:focus { border-color: var(--primary); }
    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn { flex: 1; padding: 12px; border-radius: 50px; font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; border: none; }
    .modal-btn.cancel { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); }
    .modal-btn.confirm { background: var(--primary); color: #1a1a1a; }
    .modal-btn.danger { background: var(--error); color: white; }
    
    .toast { position: fixed; top: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 24px; display: flex; align-items: center; gap: 12px; z-index: 1000; transform: translateX(120%); transition: transform 0.5s; box-shadow: 0 20px 40px rgba(0,0,0,0.5); max-width: 380px; }
    .toast.show { transform: translateX(0); }
    .toast.success { border-left: 4px solid var(--success); }
    .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .toast.success .toast-icon { background: rgba(16,185,129,0.15); }
    .toast-icon svg { width: 20px; height: 20px; color: var(--success); }
    .toast-content h4 { font-size: 0.9rem; font-weight: 700; }
    .toast-content p { font-size: 0.75rem; color: var(--muted); }
    .no-data { text-align: center; padding: 40px; color: var(--muted); }
    .add-btn { padding: 10px 20px; background: var(--primary); color: #1a1a1a; border: none; border-radius: 50px; font-family: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 16px; }
    .search-input { flex: 1; height: 42px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 0.85rem; color: var(--text); outline: none; }
    .search-input:focus { border-color: var(--primary); }
    
    @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; } .plans-grid { grid-template-columns: 1fr; } .table-header, .table-row { grid-template-columns: 1fr 1fr 0.8fr 1fr; } }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    <span class="sidebar-brand">Ev<span>onance</span></span>
  </div>
  <nav class="sidebar-nav">
    <a href="admin-dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="admin-users.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>Users</a>
    <a href="admin-deposits.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Deposits</a>
    <a href="admin-withdrawals.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="12" y1="10" x2="12" y2="18"/><polyline points="9 15 12 18 15 15"/></svg>Withdrawals</a>
    <a href="admin-investments.html" class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Investments</a>
    <a href="admin-notifications.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>Notifications</a>
    <a href="admin-settings.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user"><div class="sidebar-avatar">A</div><div class="sidebar-user-info"><div class="sidebar-user-name">Admin</div><div class="sidebar-user-role">Administrator</div></div></div>
    <button class="sidebar-logout" onclick="handleLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</button>
  </div>
</aside>

<main class="main-content">
  <div class="page-header">
    <div>
      <h1 class="page-title">Investment Management</h1>
      <p style="color:var(--muted);font-size:0.85rem;">Manage plans and view all investments</p>
    </div>
    <button class="add-btn" onclick="openAddLimitedModal()">+ Add Limited Plan</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('plans')">📊 Standard Plans</button>
    <button class="tab-btn" onclick="switchTab('limited')">⚡ Limited Plans</button>
    <button class="tab-btn" onclick="switchTab('all')">📋 All Investments</button>
  </div>

  <!-- Standard Plans -->
  <div class="tab-content active" id="tab-plans">
    <div class="plans-grid" id="standardPlansGrid"></div>
  </div>

  <!-- Limited Plans -->
  <div class="tab-content" id="tab-limited">
    <div class="plans-grid" id="limitedPlansGrid"><div class="no-data">Loading...</div></div>
  </div>

  <!-- All Investments -->
  <div class="tab-content" id="tab-all">
    <div class="search-bar">
      <input type="text" class="search-input" id="investmentSearch" placeholder="Search by user email..." oninput="loadAllInvestments()" />
    </div>
    <div class="investments-table">
      <div class="table-header"><span>User</span><span>Plan</span><span>Amount</span><span>Profit</span><span>Days</span><span>Status</span><span>Started</span></div>
      <div id="allInvestmentsList"><div class="no-data">Loading...</div></div>
    </div>
  </div>
</main>

<!-- Edit Plan Modal -->
<div class="modal-overlay" id="editPlanModal">
  <div class="modal">
    <h3>✏️ Edit Plan</h3>
    <div class="form-group"><label class="form-label">Plan Name</label><input type="text" class="form-input" id="editName" /></div>
    <div class="form-group"><label class="form-label">Investment (₦)</label><input type="number" class="form-input" id="editInvest" /></div>
    <div class="form-group"><label class="form-label">Profit (₦)</label><input type="number" class="form-input" id="editProfit" /></div>
    <div class="form-group"><label class="form-label">Duration (Days)</label><input type="number" class="form-input" id="editDays" /></div>
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeEditModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="savePlanEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- Add Limited Plan Modal -->
<div class="modal-overlay" id="addLimitedModal">
  <div class="modal">
    <h3>⚡ Add Limited Plan</h3>
    <div class="form-group"><label class="form-label">Plan Name</label><input type="text" class="form-input" id="ltdName" placeholder="e.g., Flash Deal" /></div>
    <div class="form-group"><label class="form-label">Emoji</label><input type="text" class="form-input" id="ltdEmoji" placeholder="🔥" /></div>
    <div class="form-group"><label class="form-label">Investment (₦)</label><input type="number" class="form-input" id="ltdInvest" /></div>
    <div class="form-group"><label class="form-label">Profit (₦)</label><input type="number" class="form-input" id="ltdProfit" /></div>
    <div class="form-group"><label class="form-label">Duration (Days)</label><input type="number" class="form-input" id="ltdDays" /></div>
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeAddLimitedModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="addLimitedPlan()">Create Plan</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast success" id="toast"><div class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><div class="toast-content"><h4>Success</h4><p id="toastMsg"></p></div></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, orderBy, getDocs, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyDT0ACobk5YMFgrqxb-VOnfELXTyssrOtA", authDomain: "newpro-d830e.firebaseapp.com", projectId: "newpro-d830e", storageBucket: "newpro-d830e.firebasestorage.app", messagingSenderId: "642315724384", appId: "1:642315724384:web:19def936898718e9300505" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const STANDARD_PLANS = [
    { id: 1, name: 'Starter Plan', emoji: '🥉', invest: 7000, profit: 2800, days: 2, total: 9800 },
    { id: 2, name: 'Basic Plan', emoji: '🥈', invest: 15000, profit: 7000, days: 6, total: 22000 },
    { id: 3, name: 'Standard Plan', emoji: '🥇', invest: 25000, profit: 11000, days: 10, total: 36000 },
    { id: 4, name: 'Premium Plan', emoji: '💎', invest: 45000, profit: 25000, days: 20, total: 70000 },
    { id: 5, name: 'Business Plan', emoji: '💼', invest: 70000, profit: 70000, days: 30, total: 140000 },
    { id: 6, name: 'Executive Plan', emoji: '👑', invest: 100000, profit: 120000, days: 40, total: 220000 },
    { id: 7, name: 'Elite Plan', emoji: '🚀', invest: 150000, profit: 300000, days: 50, total: 450000 },
    { id: 8, name: 'Legend Plan', emoji: '🏆', invest: 200000, profit: 500000, days: 60, total: 700000 },
    { id: 9, name: 'Ultimate Plan', emoji: '🌟', invest: 300000, profit: 1200000, days: 90, total: 1500000 }
  ];

  let currentEditPlanId = null;
  let currentEditIsStandard = true;

  function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toastMsg').textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function formatNaira(a) { return '₦' + Number(a).toLocaleString('en-NG', { minimumFractionDigits: 2 }); }
  function formatDate(ts) { if(!ts) return 'N/A'; const d = ts.toDate?ts.toDate():new Date(ts); return d.toLocaleDateString('en-NG',{month:'short',day:'numeric'}); }
  function maskEmail(e) { if(!e) return 'Unknown'; const p = e.split('@'); return p[0].substring(0,4)+'***@'+p[1]; }

  window.handleLogout = async () => { await signOut(auth); window.location.href = 'admin-login.html'; };

  window.switchTab = (tab) => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if(tab==='plans') { document.querySelector('.tab-btn:nth-child(1)').classList.add('active'); document.getElementById('tab-plans').classList.add('active'); renderStandardPlans(); }
    else if(tab==='limited') { document.querySelector('.tab-btn:nth-child(2)').classList.add('active'); document.getElementById('tab-limited').classList.add('active'); loadLimitedPlans(); }
    else { document.querySelector('.tab-btn:nth-child(3)').classList.add('active'); document.getElementById('tab-all').classList.add('active'); loadAllInvestments(); }
  };

  function renderStandardPlans() {
    document.getElementById('standardPlansGrid').innerHTML = STANDARD_PLANS.map(p => `
      <div class="plan-card">
        <h4><span>${p.emoji}</span>${p.name}</h4>
        <div class="plan-detail"><span>Investment</span><span>${formatNaira(p.invest)}</span></div>
        <div class="plan-detail"><span>Profit</span><span style="color:var(--success);">+${formatNaira(p.profit)}</span></div>
        <div class="plan-detail"><span>Duration</span><span>${p.days} Days</span></div>
        <div class="plan-detail"><span>Total Return</span><span style="color:var(--success);">${formatNaira(p.total)}</span></div>
        <div class="plan-detail"><span>Status</span><span style="color:var(--success);">Active</span></div>
        <div class="plan-actions">
          <button class="action-btn edit" onclick="openEditStandardModal(${p.id})">Edit</button>
        </div>
      </div>
    `).join('');
  }

  window.openEditStandardModal = (id) => {
    const plan = STANDARD_PLANS.find(p => p.id === id);
    if(!plan) return;
    currentEditPlanId = id;
    currentEditIsStandard = true;
    document.getElementById('editName').value = plan.name;
    document.getElementById('editInvest').value = plan.invest;
    document.getElementById('editProfit').value = plan.profit;
    document.getElementById('editDays').value = plan.days;
    document.getElementById('editPlanModal').classList.add('show');
  };

  window.closeEditModal = () => document.getElementById('editPlanModal').classList.remove('show');

  window.savePlanEdit = () => {
    const plan = STANDARD_PLANS.find(p => p.id === currentEditPlanId);
    if(!plan) return;
    plan.name = document.getElementById('editName').value;
    plan.invest = Number(document.getElementById('editInvest').value);
    plan.profit = Number(document.getElementById('editProfit').value);
    plan.days = Number(document.getElementById('editDays').value);
    plan.total = plan.invest + plan.profit;
    closeEditModal();
    renderStandardPlans();
    showToast('Plan updated successfully!');
  };

  async function loadLimitedPlans() {
    const grid = document.getElementById('limitedPlansGrid');
    try {
      const q = query(collection(db, 'limitedPlans'), orderBy('name'));
      const snap = await getDocs(q);
      if(snap.empty) { grid.innerHTML = '<div class="no-data">No limited plans yet</div>'; return; }
      grid.innerHTML = '';
      snap.forEach(doc => {
        const p = doc.data();
        grid.innerHTML += `
          <div class="plan-card">
            <h4><span>${p.emoji||'🔥'}</span>${p.name} <span style="font-size:0.65rem;color:${p.active?'var(--success)':'var(--error)'};">${p.active?'Active':'Inactive'}</span></h4>
            <div class="plan-detail"><span>Investment</span><span>${formatNaira(p.invest)}</span></div>
            <div class="plan-detail"><span>Profit</span><span style="color:var(--success);">+${formatNaira(p.profit)}</span></div>
            <div class="plan-detail"><span>Duration</span><span>${p.days} Days</span></div>
            <div class="plan-detail"><span>Total</span><span style="color:var(--success);">${formatNaira(p.total)}</span></div>
            <div class="plan-actions">
              <button class="action-btn edit" onclick="openEditLimitedModal('${doc.id}')">Edit</button>
              <button class="action-btn toggle ${p.active?'':'off'}" onclick="toggleLimitedPlan('${doc.id}',${p.active})">${p.active?'Deactivate':'Activate'}</button>
              <button class="action-btn delete" onclick="deleteLimitedPlan('${doc.id}')">Delete</button>
            </div>
          </div>`;
      });
    } catch(e) { console.error(e); }
  }

  window.openAddLimitedModal = () => { document.getElementById('ltdName').value='';document.getElementById('ltdEmoji').value='';document.getElementById('ltdInvest').value='';document.getElementById('ltdProfit').value='';document.getElementById('ltdDays').value=''; document.getElementById('addLimitedModal').classList.add('show'); };
  window.closeAddLimitedModal = () => document.getElementById('addLimitedModal').classList.remove('show');

  window.addLimitedPlan = async () => {
    const name = document.getElementById('ltdName').value.trim();
    const emoji = document.getElementById('ltdEmoji').value.trim() || '🔥';
    const invest = Number(document.getElementById('ltdInvest').value);
    const profit = Number(document.getElementById('ltdProfit').value);
    const days = Number(document.getElementById('ltdDays').value);
    if(!name||!invest||!profit||!days) { showToast('Please fill all fields'); return; }
    await addDoc(collection(db, 'limitedPlans'), { name, emoji, invest, profit, days, total: invest+profit, active: true, createdAt: serverTimestamp() });
    closeAddLimitedModal();
    showToast('Limited plan created!');
    loadLimitedPlans();
  };

  window.toggleLimitedPlan = async (id, current) => { await updateDoc(doc(db, 'limitedPlans', id), { active: !current }); showToast(`Plan ${current?'deactivated':'activated'}!`); loadLimitedPlans(); };
  window.deleteLimitedPlan = async (id) => { if(confirm('Delete this plan?')) { await deleteDoc(doc(db, 'limitedPlans', id)); showToast('Plan deleted!'); loadLimitedPlans(); } };

  async function loadAllInvestments() {
    const list = document.getElementById('allInvestmentsList');
    const search = document.getElementById('investmentSearch').value.toLowerCase();
    try {
      const q = query(collection(db, 'investments'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      if(snap.empty) { list.innerHTML = '<div class="no-data">No investments yet</div>'; return; }
      let investments = [];
      for(const doc of snap.docs) {
        const inv = doc.data();
        const userSnap = await getDoc(doc(db, 'users', inv.uid));
        inv.email = userSnap.exists() ? userSnap.data().email : 'Unknown';
        inv._id = doc.id;
        investments.push(inv);
      }
      if(search) investments = investments.filter(i => (i.email||'').toLowerCase().includes(search) || (i.planName||'').toLowerCase().includes(search));
      list.innerHTML = investments.map(i => `
        <div class="table-row">
          <span><div style="font-weight:600;">${maskEmail(i.email)}</div></span>
          <span>${i.planName||'N/A'}</span>
          <span>${formatNaira(i.amount)}</span>
          <span style="color:var(--success);">${formatNaira(i.totalProfit||0)}</span>
          <span>${i.totalDays||0}d</span>
          <span><span class="status-badge ${i.status}">${i.status}</span></span>
          <span>${formatDate(i.createdAt)}</span>
        </div>
      `).join('');
    } catch(e) { console.error(e); }
  }

  window.openEditLimitedModal = async (id) => {
    const snap = await getDoc(doc(db, 'limitedPlans', id));
    if(!snap.exists()) return;
    const p = snap.data();
    currentEditPlanId = id;
    currentEditIsStandard = false;
    document.getElementById('editName').value = p.name;
    document.getElementById('editInvest').value = p.invest;
    document.getElementById('editProfit').value = p.profit;
    document.getElementById('editDays').value = p.days;
    document.getElementById('editPlanModal').classList.add('show');
  };

  onAuthStateChanged(auth, async (user) => {
    if(user) { const ad = await getDoc(doc(db, 'adminUsers', user.uid)); if(ad.exists()&&ad.data().role==='admin') { renderStandardPlans(); } else window.location.href='admin-login.html'; }
    else window.location.href = 'admin-login.html';
  });
</script>
</body>
</html>

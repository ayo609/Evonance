<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Evonance – Transactions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ff; --surface: #ffffff; --elevated: #faf9ff; --elevated-hover: #f3efff;
      --primary: #7c3aed; --primary-glow: #a78bfa; --primary-shine: #8b5cf6;
      --primary-muted: rgba(124,58,237,0.08);
      --gold: #f0b90b;
      --text: #1e1b2e; --text-secondary: #4c4760; --text-muted: #8a849c;
      --border-subtle: rgba(124,58,237,0.08); --border-soft: rgba(124,58,237,0.15);
      --border-glow: rgba(124,58,237,0.35); --success: #10b981; --error: #ef4444;
      --warning: #f59e0b; --info: #3b82f6;
      --radius-sm: 10px; --radius-md: 16px; --radius-lg: 22px; --radius-xl: 28px;
      --shadow-elevated: 0 2px 4px rgba(124,58,237,0.04), 0 8px 32px rgba(124,58,237,0.08);
    }

    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); padding-bottom: 90px; position: relative; }
    #ambientCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .topbar { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.9); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border-subtle); padding: 0 20px; }
    .topbar-inner { max-width: 800px; margin: 0 auto; display: flex; align-items: center; height: 58px; gap: 14px; }
    .back-btn { background: var(--elevated); border: 1px solid var(--border-soft); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); text-decoration: none; transition: all 0.25s; flex-shrink: 0; }
    .back-btn:hover { border-color: var(--border-glow); color: var(--primary); }
    .back-btn svg { width: 17px; height: 17px; }
    .topbar-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }

    .main-layout { max-width: 800px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1; }

    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .summary-cell { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px 12px; text-align: center; box-shadow: var(--shadow-elevated); }
    .summary-cell-val { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 700; }
    .summary-cell-val.blue { color: #3b82f6; }
    .summary-cell-val.red { color: #ef4444; }
    .summary-cell-val.purple { color: var(--primary); }
    .summary-cell-val.green { color: var(--success); }
    .summary-cell-lbl { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; font-weight: 600; }

    .filter-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .filter-chip { padding: 8px 16px; border-radius: 50px; font-family: inherit; font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.25s; background: var(--surface); border: 1px solid var(--border-soft); color: var(--text-muted); white-space: nowrap; box-shadow: var(--shadow-elevated); }
    .filter-chip:hover { border-color: var(--border-glow); color: var(--text); }
    .filter-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    .search-wrap { position: relative; }
    .search-input { width: 100%; height: 46px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 50px; padding: 0 16px 0 42px; font-family: inherit; font-size: 0.84rem; color: var(--text); outline: none; transition: all 0.3s; box-shadow: var(--shadow-elevated); }
    .search-input:focus { border-color: var(--border-glow); }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); display: flex; pointer-events: none; }
    .search-icon svg { width: 16px; height: 16px; }

    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx-card { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-elevated); transition: all 0.2s; }
    .tx-card:hover { border-color: var(--border-glow); }
    .tx-icon-wrap { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .tx-icon-wrap.deposit { background: rgba(59,130,246,0.1); }
    .tx-icon-wrap.withdrawal { background: rgba(239,68,68,0.08); }
    .tx-icon-wrap.referral { background: rgba(124,58,237,0.1); }
    .tx-icon-wrap.investment { background: rgba(245,158,11,0.1); }
    .tx-icon-wrap.return { background: rgba(16,185,129,0.1); }
    .tx-icon-wrap.bonus { background: rgba(240,185,11,0.1); }
    .tx-info { flex: 1; min-width: 0; }
    .tx-type { font-size: 0.82rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .tx-desc { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-time { font-size: 0.64rem; color: var(--text-muted); margin-top: 2px; }
    .tx-right { text-align: right; flex-shrink: 0; }
    .tx-amount { font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; font-weight: 700; }
    .tx-amount.credit { color: var(--success); }
    .tx-amount.debit { color: var(--error); }
    .tx-status-badge { font-size: 0.6rem; font-weight: 700; padding: 3px 8px; border-radius: 50px; text-transform: uppercase; display: inline-block; margin-top: 4px; }
    .tx-status-badge.completed { background: rgba(16,185,129,0.1); color: var(--success); }
    .tx-status-badge.pending { background: rgba(245,158,11,0.1); color: var(--warning); }
    .tx-status-badge.failed { background: rgba(239,68,68,0.1); color: var(--error); }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state-icon { font-size: 2.8rem; margin-bottom: 12px; opacity: 0.4; }
    .empty-state h4 { font-size: 0.95rem; color: var(--text); margin-bottom: 4px; }
    .empty-state p { font-size: 0.78rem; }

    .bottom-nav { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 100; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 50px; display: flex; align-items: center; padding: 6px 8px; gap: 2px; box-shadow: 0 8px 40px rgba(124,58,237,0.2); backdrop-filter: blur(20px); }
    .nav-item { display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 50px; text-decoration: none; color: var(--text-muted); font-size: 0.7rem; font-weight: 600; transition: all 0.3s; white-space: nowrap; }
    .nav-item.active { background: var(--primary); color: #fff; box-shadow: 0 4px 16px rgba(124,58,237,0.3); }
    .nav-item:hover:not(.active) { color: var(--text); background: var(--elevated); }
    .nav-item svg { width: 18px; height: 18px; }

    @media (max-width: 500px) {
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .tx-card { flex-wrap: wrap; }
      .tx-right { width: 100%; text-align: left; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
      .bottom-nav { bottom: 6px; padding: 4px 6px; }
      .nav-item { padding: 8px 10px; font-size: 0.6rem; gap: 3px; }
      .nav-item svg { width: 15px; height: 15px; }
    }
  </style>
</head>
<body>

<canvas id="ambientCanvas"></canvas>

<header class="topbar">
  <div class="topbar-inner">
    <a href="dashboard.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <span class="topbar-title">Transactions</span>
  </div>
</header>

<main class="main-layout">

  <div class="summary-grid">
    <div class="summary-cell"><div class="summary-cell-val blue" id="sumDeposits">₦0</div><div class="summary-cell-lbl">Deposits</div></div>
    <div class="summary-cell"><div class="summary-cell-val red" id="sumWithdrawals">₦0</div><div class="summary-cell-lbl">Withdrawals</div></div>
    <div class="summary-cell"><div class="summary-cell-val purple" id="sumReferrals">₦0</div><div class="summary-cell-lbl">Referrals</div></div>
    <div class="summary-cell"><div class="summary-cell-val green" id="sumInvestments">₦0</div><div class="summary-cell-lbl">Investments</div></div>
  </div>

  <div class="filter-scroll" id="typeFilters">
    <button class="filter-chip active" onclick="filterTx('all', this)">📋 All</button>
    <button class="filter-chip" onclick="filterTx('deposit', this)">📥 Deposits</button>
    <button class="filter-chip" onclick="filterTx('withdrawal', this)">📤 Withdrawals</button>
    <button class="filter-chip" onclick="filterTx('referral_earning', this)">💰 Referrals</button>
    <button class="filter-chip" onclick="filterTx('investment', this)">📈 Investments</button>
    <button class="filter-chip" onclick="filterTx('investment_return', this)">🎉 ROI Returns</button>
    <button class="filter-chip" onclick="filterTx('daily_bonus', this)">🎁 Bonuses</button>
    <button class="filter-chip" onclick="filterTx('vip_salary', this)">💎 VIP Salary</button>
  </div>

  <div class="search-wrap">
    <span class="search-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="text" class="search-input" id="searchInput" placeholder="Search by description or type..." oninput="renderTransactions()" />
  </div>

  <div class="tx-list" id="txList">
    <div class="empty-state">
      <div class="empty-state-icon">📋</div>
      <h4>Loading Transactions...</h4>
      <p>Fetching your complete transaction history.</p>
    </div>
  </div>

</main>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    Home
  </a>
  <a href="deposit.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
    Deposit
  </a>
  <a href="withdraw.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="12" y1="10" x2="12" y2="18"/><polyline points="9 15 12 18 15 15"/></svg>
    Withdraw
  </a>
  <a href="investments.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Invest
  </a>
  <a href="profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Profile
  </a>
</nav>

<script>
  (function(){
    const c=document.getElementById('ambientCanvas'),ctx=c.getContext('2d');
    let w,h,pts=[];
    function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;}
    resize();window.addEventListener('resize',resize);
    class Pt{
      constructor(){this.reset();}
      reset(){this.x=Math.random()*w;this.y=Math.random()*h;this.s=Math.random()*1.2+0.4;this.sx=(Math.random()-0.5)*0.2;this.sy=(Math.random()-0.5)*0.2;this.o=Math.random()*0.3+0.06;this.ps=Math.random()*0.015+0.004;this.po=Math.random()*Math.PI*2;this.h=Math.random()<0.7?270:(Math.random()<0.5?45:220);}
      update(){this.x+=this.sx;this.y+=this.sy;if(this.x<-10)this.x=w+10;if(this.x>w+10)this.x=-10;if(this.y<-10)this.y=h+10;if(this.y>h+10)this.y=-10;}
      draw(){const p=Math.sin(Date.now()*this.ps+this.po)*0.3+0.7,a=this.o*p;ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,Math.PI*2);ctx.fillStyle=`hsla(${this.h},70%,55%,${a})`;ctx.fill();}
    }
    for(let i=0;i<55;i++)pts.push(new Pt());
    function anim(){ctx.clearRect(0,0,w,h);pts.forEach(p=>{p.update();p.draw();});
      for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<100){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(124,58,237,${0.03*(1-d/100)})`;ctx.lineWidth=0.35;ctx.stroke();}}}
      requestAnimationFrame(anim);}
    anim();
  })();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyDT0ACobk5YMFgrqxb-VOnfELXTyssrOtA", authDomain: "newpro-d830e.firebaseapp.com", projectId: "newpro-d830e", storageBucket: "newpro-d830e.firebasestorage.app", messagingSenderId: "642315724384", appId: "1:642315724384:web:19def936898718e9300505" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

  let allTransactions = [], currentFilter = 'all';

  function formatNaira(a) { return '₦' + Number(a || 0).toLocaleString('en-NG', { minimumFractionDigits: 2 }); }
  function formatNairaShort(a) { if (a >= 1000000) return '₦' + (a / 1000000).toFixed(1) + 'M'; if (a >= 1000) return '₦' + (a / 1000).toFixed(0) + 'K'; return '₦' + a; }
  function formatDate(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const now = new Date();
    const diff = now - d;
    const days = Math.floor(diff / 86400000);
    if (days === 0) { const h = Math.floor(diff / 3600000); if (h === 0) { const m = Math.floor(diff / 60000); return m <= 1 ? 'Just now' : m + 'm ago'; } return h + 'h ago'; }
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + 'd ago';
    return d.toLocaleDateString('en-NG', { month: 'short', day: 'numeric' });
  }

  const typeConfig = {
    deposit: { icon: '📥', cls: 'deposit', label: 'Deposit', credit: true },
    withdrawal: { icon: '📤', cls: 'withdrawal', label: 'Withdrawal', credit: false },
    referral_earning: { icon: '💰', cls: 'referral', label: 'Referral Earning', credit: true },
    referral_commission: { icon: '💰', cls: 'referral', label: 'Referral Commission', credit: true },
    investment: { icon: '📈', cls: 'investment', label: 'Investment', credit: false },
    investment_return: { icon: '🎉', cls: 'return', label: 'ROI Return', credit: true },
    daily_bonus: { icon: '🎁', cls: 'bonus', label: 'Daily Bonus', credit: true },
    vip_salary: { icon: '💎', cls: 'referral', label: 'VIP Salary', credit: true }
  };

  window.filterTx = function(type, btn) {
    currentFilter = type;
    document.querySelectorAll('#typeFilters .filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTransactions();
  };

  function renderTransactions() {
    const list = document.getElementById('txList');
    const search = document.getElementById('searchInput').value.toLowerCase();

    let filtered = allTransactions;
    if (currentFilter !== 'all') filtered = filtered.filter(t => t.type === currentFilter);
    if (search) filtered = filtered.filter(t =>
      (t.description || '').toLowerCase().includes(search) ||
      (t.type || '').toLowerCase().includes(search) ||
      (t.planName || '').toLowerCase().includes(search)
    );

    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><h4>No Transactions</h4><p>${search ? 'No results match your search.' : 'Your transactions will appear here.'}</p></div>`;
      return;
    }

    list.innerHTML = filtered.map(t => {
      const cfg = typeConfig[t.type] || { icon: '📋', cls: 'deposit', label: t.type || 'Transaction', credit: true };
      const isCredit = cfg.credit;
      return `
        <div class="tx-card">
          <div class="tx-icon-wrap ${cfg.cls}">${cfg.icon}</div>
          <div class="tx-info">
            <div class="tx-type">${cfg.label}</div>
            <div class="tx-desc">${t.description || t.planName || ''}</div>
            <div class="tx-time">${formatDate(t.createdAt)}</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount ${isCredit ? 'credit' : 'debit'}">${isCredit ? '+' : '-'}${formatNaira(t.amount)}</div>
            <span class="tx-status-badge ${t.status === 'completed' ? 'completed' : t.status === 'pending' ? 'pending' : t.status === 'confirmed' ? 'completed' : 'failed'}">${t.status || 'pending'}</span>
          </div>
        </div>`;
    }).join('');
  }

  function updateSummary() {
    let deposits = 0, withdrawals = 0, referrals = 0, investments = 0;
    allTransactions.forEach(t => {
      const amt = Number(t.amount) || 0;
      if (t.type === 'deposit') deposits += amt;
      else if (t.type === 'withdrawal') withdrawals += amt;
      else if (t.type === 'referral_earning' || t.type === 'referral_commission') referrals += amt;
      else if (t.type === 'investment') investments += amt;
      else if (t.type === 'investment_return') investments += amt;
      else if (t.type === 'vip_salary') investments += amt;
    });
    document.getElementById('sumDeposits').textContent = formatNairaShort(deposits);
    document.getElementById('sumWithdrawals').textContent = formatNairaShort(withdrawals);
    document.getElementById('sumReferrals').textContent = formatNairaShort(referrals);
    document.getElementById('sumInvestments').textContent = formatNairaShort(investments);
  }

  async function loadTransactions(uid) {
    try {
      console.log('Loading transactions for user:', uid);
      const q = query(collection(db, 'transactions'), where('uid', '==', uid), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      console.log('Transactions found:', snap.size);
      
      allTransactions = [];
      snap.forEach(d => allTransactions.push({ id: d.id, ...d.data() }));
      
      updateSummary();
      renderTransactions();
    } catch (e) {
      console.error('Transaction load error:', e);
      document.getElementById('txList').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><h4>Error Loading Transactions</h4><p>${e.message || 'Please try again.'}</p></div>`;
    }
  }

  onAuthStateChanged(auth, (u) => {
    if (u) loadTransactions(u.uid);
    else window.location.href = 'login.html';
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Evonance – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-soft: rgba(16, 185, 129, 0.1);
      --accent: #34d399;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --input-bg: #0f172a;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --glow: 0 0 40px rgba(16, 185, 129, 0.1);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background-image: 
        radial-gradient(ellipse at 100% 0%, rgba(16, 185, 129, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 0% 100%, rgba(52, 211, 153, 0.03) 0%, transparent 50%);
      padding: 20px;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Logo Section */
    .logo-section {
      text-align: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      margin-bottom: 8px;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
      position: relative;
      overflow: hidden;
    }
    .logo-icon::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg);
    }
    .logo-icon svg { width: 24px; height: 24px; position: relative; z-index: 1; }
    .logo-name {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -1px;
    }
    .logo-name span { 
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 400;
    }

    /* Login Card */
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
    }
    .login-card h2 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .login-card .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    /* Form Fields - Pill Shaped */
    .form-group {
      margin-bottom: 16px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 18px;
      color: var(--muted);
      display: flex;
      pointer-events: none;
      z-index: 1;
    }
    .input-icon svg {
      width: 18px;
      height: 18px;
    }
    .form-input {
      width: 100%;
      height: 50px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 50px;
      padding: 0 18px 0 46px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: all 0.3s;
    }
    .form-input::placeholder {
      color: #64748b;
      font-size: 0.85rem;
    }
    .form-input:focus {
      border-color: var(--primary);
      background: var(--card);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }
    .form-input.error {
      border-color: var(--error);
      background: rgba(239, 68, 68, 0.05);
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      padding: 6px;
      z-index: 1;
      transition: color 0.2s;
    }
    .password-toggle:hover {
      color: var(--primary);
    }
    .password-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* Remember & Forgot Row */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .remember-me input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .remember-me input[type="checkbox"]:checked {
      background: var(--primary);
      border-color: var(--primary);
    }
    .remember-me input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
    .forgot-link {
      font-size: 0.85rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .forgot-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, var(--primary) 0%, #059669 100%);
      color: white;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    .submit-btn:hover::before {
      left: 100%;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
    }
    .submit-btn:active {
      transform: scale(0.98);
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .submit-btn svg {
      width: 20px;
      height: 20px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Sign Up Link */
    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .signup-link a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s;
      margin-left: 4px;
    }
    .signup-link a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider-text {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* Back Button */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
      margin-bottom: 8px;
    }
    .back-link:hover {
      color: var(--primary);
    }
    .back-link svg {
      width: 16px;
      height: 16px;
    }

    /* Error Message */
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--error);
      font-size: 0.85rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .error-message.show {
      display: flex;
    }
    .error-message svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Success Toast */
    .success-toast {
      position: fixed;
      top: 20px;
      left: 20px;
      background: linear-gradient(135deg, #065f46 0%, #047857 100%);
      border: 1px solid var(--success);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
      transform: translateX(-120%);
      transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
      max-width: 380px;
    }
    .success-toast.show {
      transform: translateX(0);
    }
    .success-toast-icon {
      width: 40px;
      height: 40px;
      background: var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .success-toast-icon svg {
      width: 24px;
      height: 24px;
      color: white;
    }
    .success-toast-content h4 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }
    .success-toast-content p {
      font-size: 0.8rem;
      color: #6ee7b7;
      line-height: 1.3;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container {
        gap: 24px;
      }
      .login-card {
        padding: 24px 20px;
      }
      .logo-name {
        font-size: 1.5rem;
      }
      .options-row {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<!-- Success Toast -->
<div class="success-toast" id="successToast">
  <div class="success-toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <div class="success-toast-content">
    <h4>Login Successful! 🎉</h4>
    <p id="toastMessage">Welcome back! Redirecting to your dashboard...</p>
  </div>
</div>

<!-- Main Container -->
<div class="container">
  
  <!-- Logo -->
  <div class="logo-section">
    <a class="logo" href="index.html">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>
      <span class="logo-name">Ev<span>onance</span></span>
    </a>
    <p class="logo-subtitle">Smart Digital Wallet</p>
  </div>

  <!-- Login Form -->
  <div class="login-card">
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Back to Home
    </a>
    
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to access your Evonance wallet</p>

    <!-- Error Message -->
    <div class="error-message" id="errorMessage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span id="errorText">Invalid email or password</span>
    </div>

    <div class="form-group">
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/>
          </svg>
        </span>
        <input type="email" class="form-input" id="email" placeholder="Email address" autocomplete="email" />
      </div>
    </div>

    <div class="form-group">
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </span>
        <input type="password" class="form-input" id="password" placeholder="Enter password" autocomplete="current-password" />
        <button class="password-toggle" onclick="togglePassword('password', this)" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="options-row">
      <label class="remember-me">
        <input type="checkbox" id="rememberMe" />
        Remember me
      </label>
      <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
    </div>

    <button class="submit-btn" id="loginBtn" onclick="handleLogin()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Sign In</span>
      <svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">New to Evonance?</span>
      <div class="divider-line"></div>
    </div>

    <p class="signup-link">Don't have an account?<a href="index.html">Create Account</a></p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDT0ACobk5YMFgrqxb-VOnfELXTyssrOtA",
    authDomain: "newpro-d830e.firebaseapp.com",
    projectId: "newpro-d830e",
    storageBucket: "newpro-d830e.firebasestorage.app",
    messagingSenderId: "642315724384",
    appId: "1:642315724384:web:19def936898718e9300505"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Show error message
  function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    errorText.textContent = message;
    errorDiv.classList.add('show');
    
    // Auto-hide after 5 seconds
    setTimeout(() => {
      errorDiv.classList.remove('show');
    }, 5000);
  }

  // Hide error message
  function hideError() {
    document.getElementById('errorMessage').classList.remove('show');
  }

  // Show success toast
  function showSuccessToast(message) {
    const toast = document.getElementById('successToast');
    document.getElementById('toastMessage').textContent = message;
    toast.classList.add('show');
  }

  // Set loading state
  function setLoading(loading) {
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    
    btn.disabled = loading;
    spinner.style.display = loading ? 'block' : 'none';
    btnIcon.style.display = loading ? 'none' : 'block';
    btnText.textContent = loading ? 'Signing In...' : 'Sign In';
  }

  // Friendly error messages
  function getErrorMessage(code) {
    const errors = {
      'auth/invalid-email': 'Please enter a valid email address.',
      'auth/user-disabled': 'This account has been disabled. Contact support.',
      'auth/user-not-found': 'No account found with this email. Please sign up.',
      'auth/wrong-password': 'Incorrect password. Please try again.',
      'auth/invalid-credential': 'Invalid email or password. Please try again.',
      'auth/too-many-requests': 'Too many login attempts. Please wait and try again.',
      'auth/network-request-failed': 'Network error. Check your internet connection.'
    };
    return errors[code] || 'Login failed. Please try again.';
  }

  // Toggle password visibility
  window.togglePassword = function(fieldId, button) {
    const input = document.getElementById(fieldId);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    
    button.innerHTML = isText 
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
  };

  // Handle Enter key press
  document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('.form-input');
    inputs.forEach(input => {
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          handleLogin();
        }
        hideError();
      });
    });

    // Check for remembered email
    const rememberedEmail = localStorage.getItem('evonance_remembered_email');
    if (rememberedEmail) {
      document.getElementById('email').value = rememberedEmail;
      document.getElementById('rememberMe').checked = true;
    }
  });

  // Handle Login
  window.handleLogin = async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const rememberMe = document.getElementById('rememberMe').checked;

    // Validation
    if (!email) {
      showError('Please enter your email address.');
      document.getElementById('email').focus();
      return;
    }
    if (!password) {
      showError('Please enter your password.');
      document.getElementById('password').focus();
      return;
    }

    hideError();
    setLoading(true);
    
    try {
      // Set persistence based on "Remember me"
      if (rememberMe) {
        await setPersistence(auth, browserLocalPersistence);
        localStorage.setItem('evonance_remembered_email', email);
      } else {
        await setPersistence(auth, browserSessionPersistence);
        localStorage.removeItem('evonance_remembered_email');
      }

      // Sign in user
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Verify user exists in Firestore
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      
      if (userDoc.exists()) {
        // Update last login timestamp
        await updateDoc(doc(db, 'users', user.uid), {
          lastLogin: serverTimestamp()
        });

        setLoading(false);
        
        // Show success toast
        showSuccessToast('Welcome back! Redirecting to your dashboard...');
        
        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
        
      } else {
        // User exists in Auth but not in Firestore (shouldn't happen normally)
        setLoading(false);
        showError('Account data not found. Please contact support.');
        
        // Sign out the user since their data is incomplete
        await auth.signOut();
      }
      
    } catch (error) {
      setLoading(false);
      console.error('Login error:', error);
      
      // Show appropriate error message
      showError(getErrorMessage(error.code));
      
      // Clear password field on failed attempt
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  };
</script>

</body>
</html>

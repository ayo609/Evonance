<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Evonance – Admin Withdrawals</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e17; --card: #111827; --card-hover: #1a2332;
      --primary: #f59e0b; --primary-dark: #d97706; --primary-soft: rgba(245,158,11,0.1);
      --accent: #fbbf24; --text: #f1f5f9; --muted: #94a3b8; --border: #1e293b;
      --input-bg: #0f172a; --success: #10b981; --error: #ef4444; --warning: #f59e0b; --info: #3b82f6;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); padding-bottom: 80px; }

    .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 8px; border-radius: 10px; display: flex; text-decoration: none; }
    .back-btn:hover { background: var(--card-hover); color: var(--text); }
    .back-btn svg { width: 20px; height: 20px; }
    .header-title { font-size: 1.2rem; font-weight: 800; }

    .main-content { max-width: 1000px; margin: 0 auto; padding: 20px; }

    /* Toggle Section */
    .toggle-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
    .toggle-info h3 { font-size: 0.95rem; font-weight: 700; }
    .toggle-info p { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .toggle-switch { position: relative; width: 56px; height: 30px; cursor: pointer; }
    .toggle-switch input { display: none; }
    .toggle-slider { position: absolute; inset: 0; background: var(--error); border-radius: 30px; transition: all 0.3s; }
    .toggle-slider::before { content: ''; position: absolute; width: 24px; height: 24px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: all 0.3s; }
    .toggle-switch input:checked + .toggle-slider { background: var(--success); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(26px); }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 800; }
    .stat-value.pending { color: var(--warning); }
    .stat-value.approved { color: var(--success); }
    .stat-value.declined { color: var(--error); }
    .stat-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

    .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px 16px; border: none; background: transparent; color: var(--muted); font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 12px; transition: all 0.3s; text-align: center; }
    .tab-btn.active { background: var(--primary); color: #1a1a1a; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .withdrawals-list { display: flex; flex-direction: column; gap: 10px; }
    .withdrawal-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .card-user { display: flex; align-items: center; gap: 10px; }
    .card-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--primary); font-size: 0.9rem; }
    .card-info h4 { font-size: 0.85rem; font-weight: 600; }
    .card-info p { font-size: 0.7rem; color: var(--muted); }
    .card-amount { text-align: right; }
    .card-amount .main { font-size: 1.1rem; font-weight: 800; }
    .card-amount .fee { font-size: 0.7rem; color: var(--error); }
    .card-amount .net { font-size: 0.85rem; color: var(--success); font-weight: 700; }

    .card-details { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
    .card-detail { background: var(--input-bg); border-radius: 10px; padding: 10px; }
    .card-detail .lbl { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .card-detail .val { font-size: 0.82rem; font-weight: 600; margin-top: 2px; }

    .card-actions { display: flex; gap: 8px; }
    .action-btn { flex: 1; padding: 10px; border-radius: 10px; font-family: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
    .action-btn.approve { background: var(--success); color: white; }
    .action-btn.approve:hover { background: #059669; }
    .action-btn.decline { background: var(--error); color: white; }
    .action-btn.decline:hover { background: #dc2626; }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 50px; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; }
    .status-badge.pending { background: rgba(245,158,11,0.15); color: var(--warning); }
    .status-badge.approved { background: rgba(16,185,129,0.15); color: var(--success); }
    .status-badge.declined { background: rgba(239,68,68,0.15); color: var(--error); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; max-width: 420px; width: 100%; }
    .modal h3 { font-size: 1rem; margin-bottom: 12px; text-align: center; }
    .modal p { font-size: 0.82rem; color: var(--muted); text-align: center; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .form-input { width: 100%; height: 42px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 0.85rem; color: var(--text); outline: none; }
    .form-input:focus { border-color: var(--primary); }
    textarea.form-input { height: 70px; padding: 10px 12px; resize: vertical; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 16px; }
    .modal-btn { flex: 1; padding: 11px; border-radius: 50px; font-family: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
    .modal-btn.cancel { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); }
    .modal-btn.danger { background: var(--error); color: white; }
    .modal-btn.danger:hover { background: #dc2626; }

    .toast { position: fixed; top: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 24px; display: flex; align-items: center; gap: 12px; z-index: 1000; transform: translateX(120%); transition: transform 0.5s; box-shadow: 0 20px 40px rgba(0,0,0,0.5); max-width: 380px; }
    .toast.show { transform: translateX(0); }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--error); }
    .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .toast.success .toast-icon { background: rgba(16,185,129,0.15); }
    .toast-icon svg { width: 20px; height: 20px; color: var(--success); }
    .toast-content h4 { font-size: 0.9rem; font-weight: 700; }
    .toast-content p { font-size: 0.75rem; color: var(--muted); }

    .no-data { text-align: center; padding: 40px; color: var(--muted); font-size: 0.85rem; }
    .refresh-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 50px; font-family: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .refresh-btn:hover { background: var(--card-hover); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding: 8px 0 10px; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 0.6rem; font-weight: 600; padding: 4px 10px; border-radius: 8px; }
    .nav-item.active { color: var(--primary); }
    .nav-item svg { width: 20px; height: 20px; }

    @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2,1fr); } .card-details { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="toast success" id="toast"><div class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><div class="toast-content"><h4>Success</h4><p id="toastMsg"></p></div></div>

<header class="header">
  <div class="header-left">
    <a href="admin-dashboard.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
    <span class="header-title">Withdrawal Management</span>
  </div>
  <button class="refresh-btn" onclick="loadAll()">🔄 Refresh</button>
</header>

<main class="main-content">

  <!-- ============ TOGGLE WITHDRAWALS ON/OFF ============ -->
  <div class="toggle-section">
    <div class="toggle-info">
      <h3>Withdrawal System</h3>
      <p id="toggleStatus">Checking status...</p>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="withdrawalToggle" onchange="toggleWithdrawals()" />
      <span class="toggle-slider"></span>
    </label>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-value pending" id="statPending">0</div><div class="stat-label">Pending</div></div>
    <div class="stat-card"><div class="stat-value approved" id="statApproved">0</div><div class="stat-label">Approved</div></div>
    <div class="stat-card"><div class="stat-value declined" id="statDeclined">0</div><div class="stat-label">Declined</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--info);" id="statTotal">₦0</div><div class="stat-label">Total Value</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pending')">🟡 Pending</button>
    <button class="tab-btn" onclick="switchTab('approved')">✅ Approved</button>
    <button class="tab-btn" onclick="switchTab('declined')">❌ Declined</button>
  </div>

  <div class="tab-content active" id="tab-pending"><div class="withdrawals-list" id="pendingList"><div class="no-data">Loading...</div></div></div>
  <div class="tab-content" id="tab-approved"><div class="withdrawals-list" id="approvedList"><div class="no-data">Loading...</div></div></div>
  <div class="tab-content" id="tab-declined"><div class="withdrawals-list" id="declinedList"><div class="no-data">Loading...</div></div></div>

</main>

<!-- Decline Modal -->
<div class="modal-overlay" id="declineModal">
  <div class="modal">
    <h3>❌ Decline Withdrawal</h3>
    <p>The amount will be refunded to the user's withdrawal wallet.</p>
    <div class="form-group"><label class="form-label">Reason (optional)</label><input type="text" class="form-input" id="declineReason" placeholder="Enter reason..." /></div>
    <div class="modal-buttons"><button class="modal-btn cancel" onclick="closeDeclineModal()">Cancel</button><button class="modal-btn danger" onclick="confirmDecline()">Decline & Refund</button></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="admin-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
  <a href="admin-users.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Users</a>
  <a href="admin-deposits.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Deposits</a>
  <a href="admin-withdrawals.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="12" y1="10" x2="12" y2="18"/><polyline points="9 15 12 18 15 15"/></svg>Withdrawals</a>
  <a href="admin-add.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Plans</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, serverTimestamp, increment, addDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyDT0ACobk5YMFgrqxb-VOnfELXTyssrOtA", authDomain: "newpro-d830e.firebaseapp.com", projectId: "newpro-d830e", storageBucket: "newpro-d830e.firebasestorage.app", messagingSenderId: "642315724384", appId: "1:642315724384:web:19def936898718e9300505" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

  let currentDeclineId = null, currentTab = 'pending';

  function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toastMsg').textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function formatNaira(a) { return '₦' + Number(a).toLocaleString('en-NG', { minimumFractionDigits: 2 }); }
  function formatDate(ts) { if(!ts) return 'N/A'; const d = ts.toDate?ts.toDate():new Date(ts); return d.toLocaleDateString('en-NG',{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'}); }
  function maskEmail(e) { if(!e) return ''; const p = e.split('@'); return p[0].substring(0,4)+'***@'+p[1]; }

  // ============ TOGGLE WITHDRAWALS ============
  async function loadToggleState() {
    try {
      const snap = await getDoc(doc(db,'settings','withdrawalConfig'));
      const enabled = snap.exists() ? (snap.data().enabled !== false) : true;
      document.getElementById('withdrawalToggle').checked = enabled;
      document.getElementById('toggleStatus').textContent = enabled ? '🟢 Withdrawals are OPEN - Users can submit requests' : '🔴 Withdrawals are CLOSED - Users cannot submit requests';
    } catch(e) { console.error(e); }
  }

  window.toggleWithdrawals = async function() {
    const enabled = document.getElementById('withdrawalToggle').checked;
    await setDoc(doc(db,'settings','withdrawalConfig'), { enabled, updatedAt: serverTimestamp() }, { merge: true });
    document.getElementById('toggleStatus').textContent = enabled ? '🟢 Withdrawals are OPEN' : '🔴 Withdrawals are CLOSED';
    showToast(enabled ? 'Withdrawals ENABLED' : 'Withdrawals DISABLED');
  };

  // ============ TABS ============
  window.switchTab = (tab) => {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if(tab==='pending') { document.querySelector('.tab-btn:nth-child(1)').classList.add('active'); document.getElementById('tab-pending').classList.add('active'); }
    else if(tab==='approved') { document.querySelector('.tab-btn:nth-child(2)').classList.add('active'); document.getElementById('tab-approved').classList.add('active'); }
    else { document.querySelector('.tab-btn:nth-child(3)').classList.add('active'); document.getElementById('tab-declined').classList.add('active'); }
    loadAll();
  };

  // ============ LOAD ALL ============
  async function loadAll() {
    try {
      const q = query(collection(db,'withdrawals'), orderBy('createdAt','desc'));
      const snap = await getDocs(q);
      let pending=[], approved=[], declined=[], totalVal=0;
      snap.forEach(d => {
        const w = { id: d.id, ...d.data() }; totalVal += w.amount||0;
        if(w.status==='pending') pending.push(w);
        else if(w.status==='approved'||w.status==='completed') approved.push(w);
        else declined.push(w);
      });
      document.getElementById('statPending').textContent = pending.length;
      document.getElementById('statApproved').textContent = approved.length;
      document.getElementById('statDeclined').textContent = declined.length;
      document.getElementById('statTotal').textContent = formatNaira(totalVal);
      renderList('pendingList', pending, true);
      renderList('approvedList', approved, false);
      renderList('declinedList', declined, false);
    } catch(e) { console.error(e); }
  }

  function renderList(listId, items, showActions) {
    const list = document.getElementById(listId);
    if(items.length===0) { list.innerHTML='<div class="no-data">No withdrawals found</div>'; return; }
    list.innerHTML = items.map(w => `
      <div class="withdrawal-card">
        <div class="card-top">
          <div class="card-user">
            <div class="card-avatar">${(w.email||'U').charAt(0).toUpperCase()}</div>
            <div class="card-info"><h4>${maskEmail(w.email||'')}</h4><p>${formatDate(w.createdAt)}</p></div>
          </div>
          <div class="card-amount">
            <div class="main">${formatNaira(w.amount)}</div>
            <div class="fee">Fee: -${formatNaira(w.fee||0)}</div>
            <div class="net">Net: ${formatNaira(w.netAmount||0)}</div>
            <span class="status-badge ${w.status}">${w.status}</span>
          </div>
        </div>
        <div class="card-details">
          <div class="card-detail"><div class="lbl">Bank</div><div class="val">${w.bankName||'N/A'}</div></div>
          <div class="card-detail"><div class="lbl">Account Number</div><div class="val">${w.accountNumber||'N/A'}</div></div>
          <div class="card-detail"><div class="lbl">Account Name</div><div class="val">${w.accountName||'N/A'}</div></div>
          ${w.declineReason ? `<div class="card-detail"><div class="lbl">Decline Reason</div><div class="val" style="color:var(--error);">${w.declineReason}</div></div>` : ''}
          ${w.processedAt ? `<div class="card-detail"><div class="lbl">Processed</div><div class="val">${formatDate(w.processedAt)}</div></div>` : ''}
        </div>
        ${showActions ? `
        <div class="card-actions">
          <button class="action-btn approve" onclick="approveWithdrawal('${w.id}')">✅ Approve</button>
          <button class="action-btn decline" onclick="openDeclineModal('${w.id}')">❌ Decline & Refund</button>
        </div>` : ''}
      </div>`).join('');
  }

  // ============ APPROVE ============
  window.approveWithdrawal = async (id) => {
    try {
      const snap = await getDoc(doc(db,'withdrawals',id));
      if(!snap.exists()) return;
      const w = snap.data();
      await updateDoc(doc(db,'withdrawals',id), { status: 'approved', processedAt: serverTimestamp() });
      await addDoc(collection(db,'notifications'), { uid: w.uid, title: '✅ Withdrawal Approved!', message: `Your withdrawal of ${formatNaira(w.netAmount||w.amount)} to ${w.bankName} has been approved.`, type: 'withdrawal', read: false, createdAt: serverTimestamp() });
      showToast('Withdrawal approved!');
      loadAll();
    } catch(e) { showToast('Error approving'); }
  };

  // ============ DECLINE & REFUND ============
  window.openDeclineModal = (id) => { currentDeclineId = id; document.getElementById('declineReason').value = ''; document.getElementById('declineModal').classList.add('show'); };
  window.closeDeclineModal = () => { document.getElementById('declineModal').classList.remove('show'); currentDeclineId = null; };

  window.confirmDecline = async () => {
    if(!currentDeclineId) return;
    const reason = document.getElementById('declineReason').value || 'No reason provided';
    try {
      const snap = await getDoc(doc(db,'withdrawals',currentDeclineId));
      if(!snap.exists()) return;
      const w = snap.data();
      
      // Refund to user's withdrawal wallet
      await updateDoc(doc(db,'users',w.uid), { withdrawalWallet: increment(w.amount) });
      
      // Update withdrawal status
      await updateDoc(doc(db,'withdrawals',currentDeclineId), { status: 'declined', declineReason: reason, processedAt: serverTimestamp() });
      
      // Notify user
      await addDoc(collection(db,'notifications'), { uid: w.uid, title: '❌ Withdrawal Declined', message: `Your withdrawal of ${formatNaira(w.amount)} was declined. Reason: ${reason}. Amount has been refunded to your Withdrawal Wallet.`, type: 'withdrawal', read: false, createdAt: serverTimestamp() });
      
      closeDeclineModal();
      showToast('Withdrawal declined & refunded!');
      loadAll();
    } catch(e) { showToast('Error declining'); }
  };

  // ============ INIT ============
  loadToggleState();
  loadAll();

  onAuthStateChanged(auth, async (u) => {
    if(u) { const ad = await getDoc(doc(db,'adminUsers',u.uid)); if(ad.exists()&&ad.data().role==='admin') { /* authorized */ } else window.location.href='admin-login.html'; }
    else window.location.href = 'admin-login.html';
  });
</script>
</body>
</html>

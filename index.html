<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Evonance – Join Now</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ff;
      --surface: #ffffff;
      --elevated: #faf9ff;
      --primary: #7c3aed;
      --primary-glow: #a78bfa;
      --primary-shine: #8b5cf6;
      --primary-soft: rgba(124,58,237,0.08);
      --text: #1e1b2e;
      --text-secondary: #4c4760;
      --text-muted: #8a849c;
      --border-subtle: rgba(124,58,237,0.08);
      --border-soft: rgba(124,58,237,0.15);
      --border-glow: rgba(124,58,237,0.4);
      --success: #10b981;
      --error: #ef4444;
      --gold: #f0b90b;
      --gold-soft: rgba(240,185,11,0.12);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --shadow-card: 0 2px 4px rgba(124,58,237,0.04), 0 8px 32px rgba(124,58,237,0.08);
      --shadow-glow: 0 0 60px rgba(124,58,237,0.1), 0 0 120px rgba(124,58,237,0.04);
      --shadow-btn: 0 4px 20px rgba(124,58,237,0.3);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      display: flex;
      overflow-x: hidden;
      position: relative;
    }

    #ambientCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== LEFT BRAND PANEL ===== */
    .brand-panel {
      width: 42%;
      min-height: 100vh;
      background: linear-gradient(160deg, #ffffff 0%, #f5f3ff 50%, #ede9fe 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      position: relative;
      z-index: 1;
      overflow: hidden;
      border-right: 1px solid var(--border-subtle);
    }
    .brand-panel::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle at center, rgba(124,58,237,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .brand-panel::after {
      content: '';
      position: absolute;
      bottom: -20%;
      left: -15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle at center, rgba(139,92,246,0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .brand-content {
      position: relative;
      z-index: 1;
      max-width: 420px;
      text-align: center;
    }

    /* Logo Mark — Rotating Rings */
    .brand-mark {
      width: 90px;
      height: 90px;
      margin: 0 auto 28px;
      position: relative;
    }
    .brand-mark-inner {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .brand-ring.outer {
      width: 90px;
      height: 90px;
      border-top-color: var(--primary);
      border-right-color: var(--primary-shine);
      animation: ringRotate 8s linear infinite;
    }
    .brand-ring.middle {
      width: 66px;
      height: 66px;
      border-bottom-color: var(--primary-shine);
      border-left-color: var(--primary-glow);
      animation: ringRotate 6s linear infinite reverse;
    }
    .brand-ring.inner-ring {
      width: 42px;
      height: 42px;
      border-top-color: var(--gold);
      border-right-color: var(--gold);
      animation: ringRotate 4s linear infinite;
    }
    @keyframes ringRotate {
      to { transform: rotate(360deg); }
    }
    .brand-diamond {
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-shine), var(--primary-glow));
      transform: rotate(45deg);
      border-radius: 3px;
      box-shadow: 0 0 20px rgba(124,58,237,0.5), 0 0 40px rgba(139,92,246,0.25), 0 0 60px rgba(167,139,250,0.15);
      z-index: 1;
      animation: diamondPulse 2s ease-in-out infinite;
    }
    @keyframes diamondPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(124,58,237,0.5), 0 0 40px rgba(139,92,246,0.25); }
      50% { box-shadow: 0 0 30px rgba(124,58,237,0.7), 0 0 60px rgba(139,92,246,0.4), 0 0 80px rgba(167,139,250,0.2); }
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .brand-title span {
      background: linear-gradient(135deg, var(--primary-shine) 0%, var(--primary) 50%, var(--primary-glow) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-tagline {
      font-size: 0.9rem;
      color: var(--text-secondary);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 40px;
    }

    /* Stat Pills */
    .stat-pills {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 50px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(10px);
    }
    .stat-pill-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }
    .stat-pill-icon.purple { background: var(--primary-soft); }
    .stat-pill-icon.gold { background: var(--gold-soft); }
    .stat-pill-info { text-align: left; }
    .stat-pill-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
    }
    .stat-pill-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ===== RIGHT FORM PANEL ===== */
    .form-panel {
      flex: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      z-index: 1;
      background: linear-gradient(160deg, #f5f3ff 0%, #ffffff 50%, #faf9ff 100%);
    }

    .form-container {
      width: 100%;
      max-width: 460px;
      position: relative;
    }

    .form-top-nav {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }
    .nav-pill {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 50px;
      padding: 10px 22px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-card);
    }
    .nav-pill:hover {
      border-color: var(--border-glow);
      color: var(--primary);
      box-shadow: 0 0 20px rgba(124,58,237,0.15);
    }
    .nav-pill svg { width: 14px; height: 14px; }

    .form-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-card), var(--shadow-glow);
      position: relative;
    }
    .form-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 30px;
      right: 30px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), var(--primary-glow), transparent);
    }

    .form-header {
      margin-bottom: 28px;
    }
    .form-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      color: var(--text);
    }
    .form-header p {
      color: var(--text-secondary);
      font-size: 0.88rem;
    }

    .progress-steps {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }
    .progress-step {
      flex: 1;
      height: 3px;
      background: var(--border-soft);
      border-radius: 2px;
      transition: all 0.4s;
    }
    .progress-step.active { background: var(--primary); }
    .progress-step.done { background: var(--primary-glow); opacity: 0.7; }

    .referral-tag {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--gold-soft);
      border: 1px solid rgba(240,185,11,0.25);
      border-radius: 50px;
      padding: 8px 16px;
      margin-bottom: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #b8860b;
    }
    .referral-tag.show { display: inline-flex; }
    .referral-tag-dot {
      width: 8px;
      height: 8px;
      background: var(--gold);
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(240,185,11,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(240,185,11,0); }
    }

    .field-group {
      margin-bottom: 18px;
      position: relative;
    }
    .field-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      transition: color 0.3s;
    }
    .field-group:focus-within .field-label {
      color: var(--primary);
    }

    .input-row {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-leading {
      position: absolute;
      left: 16px;
      z-index: 1;
      color: var(--text-muted);
      display: flex;
      pointer-events: none;
      transition: color 0.3s;
    }
    .field-group:focus-within .input-leading {
      color: var(--primary);
    }
    .input-leading svg { width: 16px; height: 16px; }

    .form-input {
      width: 100%;
      height: 50px;
      background: #faf9ff;
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 0 16px 0 46px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: all 0.3s;
      letter-spacing: 0.3px;
    }
    .form-input::placeholder {
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.08), 0 0 20px rgba(124,58,237,0.06);
      background: #ffffff;
    }
    .form-input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(239,68,68,0.08);
    }
    .form-input.success {
      border-color: var(--success);
    }

    .input-trailing {
      position: absolute;
      right: 12px;
      z-index: 1;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 6px;
      display: flex;
      transition: color 0.3s;
    }
    .input-trailing:hover { color: var(--primary); }
    .input-trailing svg { width: 16px; height: 16px; }

    .field-feedback {
      font-size: 0.74rem;
      margin-top: 6px;
      padding-left: 4px;
      font-weight: 500;
      display: none;
    }
    .field-feedback.valid { color: var(--success); display: block; }
    .field-feedback.invalid { color: var(--error); display: block; }
    .field-feedback.checking { color: var(--text-muted); display: block; }

    .strength-indicator {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .strength-segment {
      flex: 1;
      height: 3px;
      background: var(--border-soft);
      border-radius: 2px;
      transition: all 0.3s;
    }
    .strength-segment.weak { background: #ef4444; }
    .strength-segment.medium { background: #f59e0b; }
    .strength-segment.strong { background: var(--primary); }

    .submit-btn {
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, var(--primary-shine) 0%, var(--primary) 50%, #6d28d9 100%);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-btn);
    }
    .submit-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }
    .submit-btn:hover::after { transform: translateX(100%); }
    .submit-btn:hover {
      box-shadow: 0 8px 32px rgba(124,58,237,0.45);
      transform: translateY(-1px);
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .submit-spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .form-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.86rem;
      color: var(--text-secondary);
    }
    .form-footer a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
      transition: color 0.3s;
    }
    .form-footer a:hover { color: var(--primary-shine); }

    /* Toast */
    .toast-overlay {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast-item {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(124,58,237,0.15);
      transform: translateX(-120%);
      transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      pointer-events: auto;
      max-width: 400px;
    }
    .toast-item.show { transform: translateX(0); }
    .toast-item.success { border-left: 3px solid var(--success); }
    .toast-item.error { border-left: 3px solid var(--error); }
    .toast-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .toast-item.success .toast-icon-wrap { background: rgba(16,185,129,0.12); }
    .toast-item.error .toast-icon-wrap { background: rgba(239,68,68,0.12); }
    .toast-icon-wrap svg { width: 18px; height: 18px; }
    .toast-item.success .toast-icon-wrap svg { color: var(--success); }
    .toast-item.error .toast-icon-wrap svg { color: var(--error); }
    .toast-text h4 { font-size: 0.88rem; font-weight: 700; color: var(--text); }
    .toast-text p { font-size: 0.76rem; color: var(--text-secondary); }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .brand-panel {
        width: 100%;
        min-height: auto;
        padding: 40px 20px 30px;
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
      }
      .brand-title { font-size: 2rem; }
      .brand-mark { width: 70px; height: 70px; margin-bottom: 20px; }
      .brand-ring.outer { width: 70px; height: 70px; }
      .brand-ring.middle { width: 50px; height: 50px; }
      .brand-ring.inner-ring { width: 32px; height: 32px; }
      .brand-diamond { width: 14px; height: 14px; }
      .stat-pills { flex-direction: column; align-items: center; }
      .form-panel { padding: 30px 20px 50px; }
      .form-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<canvas id="ambientCanvas"></canvas>

<div class="toast-overlay" id="toastContainer"></div>

<!-- ============ LEFT BRAND PANEL ============ -->
<div class="brand-panel">
  <div class="brand-content">
    <!-- Rotating Rings Logo -->
    <div class="brand-mark">
      <div class="brand-mark-inner">
        <div class="brand-ring outer"></div>
        <div class="brand-ring middle"></div>
        <div class="brand-ring inner-ring"></div>
        <div class="brand-diamond"></div>
      </div>
    </div>
    <h1 class="brand-title">Ev<span>onance</span></h1>
    <p class="brand-tagline">Digital Wealth Platform</p>

    <div class="stat-pills">
      <div class="stat-pill">
        <div class="stat-pill-icon purple">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        </div>
        <div class="stat-pill-info">
          <div class="stat-pill-value">₦0.00</div>
          <div class="stat-pill-label">Start Balance</div>
        </div>
      </div>
      <div class="stat-pill">
        <div class="stat-pill-icon gold">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f0b90b" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="stat-pill-info">
          <div class="stat-pill-value">10%</div>
          <div class="stat-pill-label">Referral Bonus</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ RIGHT FORM PANEL ============ -->
<div class="form-panel">
  <div class="form-container">

    <div class="form-top-nav">
      <a href="login.html" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </a>
    </div>

    <div class="referral-tag" id="referralTag">
      <span class="referral-tag-dot"></span>
      Referral: <strong id="referralTagCode">—</strong>
    </div>

    <div class="form-card">
      <div class="form-header">
        <h2>Create Account</h2>
        <p>Begin your journey with Evonance</p>
      </div>

      <div class="progress-steps">
        <div class="progress-step active" id="step1"></div>
        <div class="progress-step" id="step2"></div>
        <div class="progress-step" id="step3"></div>
        <div class="progress-step" id="step4"></div>
      </div>

      <div class="field-group">
        <label class="field-label">Referral Code</label>
        <div class="input-row">
          <span class="input-leading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
          </span>
          <input type="text" class="form-input" id="referral" placeholder="Optional referral code" autocomplete="off" />
        </div>
        <div class="field-feedback" id="referralFeedback"></div>
      </div>

      <div class="field-group">
        <label class="field-label">Email Address</label>
        <div class="input-row">
          <span class="input-leading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
          </span>
          <input type="email" class="form-input" id="email" placeholder="you@example.com" autocomplete="email" />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Phone Number</label>
        <div class="input-row">
          <span class="input-leading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          </span>
          <input type="tel" class="form-input" id="phone" placeholder="0800 000 0000" autocomplete="tel" />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="input-row">
          <span class="input-leading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          </span>
          <input type="password" class="form-input" id="password" placeholder="Min. 6 characters" autocomplete="new-password" />
          <button class="input-trailing" onclick="togglePassword('password', this)" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-indicator">
          <div class="strength-segment" id="seg1"></div>
          <div class="strength-segment" id="seg2"></div>
          <div class="strength-segment" id="seg3"></div>
          <div class="strength-segment" id="seg4"></div>
          <div class="strength-segment" id="seg5"></div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Confirm Password</label>
        <div class="input-row">
          <span class="input-leading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          </span>
          <input type="password" class="form-input" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" />
          <button class="input-trailing" onclick="togglePassword('confirmPassword', this)" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>

      <button class="submit-btn" id="registerBtn" onclick="handleRegister()">

        Already have an account?<a href="login.html">Sign In</a>

</div>

<script>
  (function() {
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, particles = [];
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    class Particle {
      constructor() { this.reset(); }
      reset() { this.x = Math.random() * w; this.y = Math.random() * h; this.size = Math.random() * 1.5 + 0.5; this.speedX = (Math.random() - 0.5) * 0.3; this.speedY = (Math.random() - 0.5) * 0.3; this.opacity = Math.random() * 0.4 + 0.1; this.pulseSpeed = Math.random() * 0.02 + 0.005; this.pulseOffset = Math.random() * Math.PI * 2; this.hue = Math.random() < 0.7 ? 270 : (Math.random() < 0.5 ? 45 : 220); }
      update() { this.x += this.speedX; this.y += this.speedY; if (this.x < -10) this.x = w + 10; if (this.x > w + 10) this.x = -10; if (this.y < -10) this.y = h + 10; if (this.y > h + 10) this.y = -10; }
      draw() { const pulse = Math.sin(Date.now() * this.pulseSpeed + this.pulseOffset) * 0.3 + 0.7; const alpha = this.opacity * pulse; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = `hsla(${this.hue}, 70%, 55%, ${alpha})`; ctx.fill(); }
    }
    for (let i = 0; i < 80; i++) particles.push(new Particle());
    function animate() { ctx.clearRect(0, 0, w, h); particles.forEach(p => { p.update(); p.draw(); });
      for (let i = 0; i < particles.length; i++) { for (let j = i + 1; j < particles.length; j++) { const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y; const dist = Math.sqrt(dx * dx + dy * dy); if (dist < 120) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(124,58,237,${0.04 * (1 - dist/120)})`; ctx.lineWidth = 0.5; ctx.stroke(); } } }
      requestAnimationFrame(animate); }
    animate();
  })();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDT0ACobk5YMFgrqxb-VOnfELXTyssrOtA",
    authDomain: "newpro-d830e.firebaseapp.com",
    projectId: "newpro-d830e",
    storageBucket: "newpro-d830e.firebasestorage.app",
    messagingSenderId: "642315724384",
    appId: "1:642315724384:web:19def936898718e9300505"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function showToast(type, title, msg, duration = 4000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast-item ${type}`;
    toast.innerHTML = `<div class="toast-icon-wrap">
      ${type === 'success' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'}
    </div><div class="toast-text"><h4>${title}</h4><p>${msg}</p></div>`;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, duration);
  }

  function setLoading(loading) {
    const btn = document.getElementById('registerBtn');
    document.getElementById('spinner').style.display = loading ? 'block' : 'none';
    document.getElementById('btnText').textContent = loading ? 'Creating Account...' : 'Create Account';
    btn.disabled = loading;
  }

  function setFieldStatus(fieldId, status) {
    const field = document.getElementById(fieldId);
    field.classList.remove('error', 'success');
    if (status) field.classList.add(status);
  }

  function updateProgress(count) {
    for (let i = 1; i <= 4; i++) {
      const step = document.getElementById('step' + i);
      step.classList.remove('active', 'done');
      if (i <= count) step.classList.add('done');
      if (i === count + 1) step.classList.add('active');
    }
  }

  function getErrorMessage(code) {
    const errors = {
      'auth/email-already-in-use': 'This email is already registered.',
      'auth/invalid-email': 'Please enter a valid email address.',
      'auth/weak-password': 'Password too weak. Use at least 6 characters.',
      'auth/network-request-failed': 'Network error. Check your connection.',
      'auth/too-many-requests': 'Too many attempts. Please wait.',
    };
    return errors[code] || 'Something went wrong. Please try again.';
  }

  function getReferralFromURL() { return new URLSearchParams(window.location.search).get('ref') || null; }

  function autoFillReferral(code) {
    if (!code) return;
    document.getElementById('referral').value = code.toUpperCase();
    document.getElementById('referralTagCode').textContent = code.toUpperCase();
    document.getElementById('referralTag').classList.add('show');
    validateReferral();
  }

  let validationTimeout;
  window.validateReferral = function() {
    clearTimeout(validationTimeout);
    const code = document.getElementById('referral').value.trim().toUpperCase();
    const feedback = document.getElementById('referralFeedback');
    const input = document.getElementById('referral');
    if (!code || code.length < 5) { feedback.className = 'field-feedback'; feedback.textContent = ''; setFieldStatus('referral', null); updateProgress(0); return; }
    feedback.className = 'field-feedback checking'; feedback.textContent = 'Verifying...'; setFieldStatus('referral', null);
    validationTimeout = setTimeout(async () => {
      try {
        const codeDoc = await getDoc(doc(db, 'referralCodes', code));
        if (codeDoc.exists()) {
          const userDoc = await getDoc(doc(db, 'users', codeDoc.data().uid));
          if (userDoc.exists()) { feedback.className = 'field-feedback valid'; feedback.textContent = '✓ Valid referral code — bonus activated'; setFieldStatus('referral', 'success'); updateProgress(1); return; }
        }
        feedback.className = 'field-feedback invalid'; feedback.textContent = '✗ Invalid referral code'; setFieldStatus('referral', 'error'); updateProgress(0);
      } catch { feedback.className = 'field-feedback invalid'; feedback.textContent = 'Verification error'; setFieldStatus('referral', 'error'); }
    }, 600);
  };

  window.togglePassword = function(fieldId, button) {
    const input = document.getElementById(fieldId);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    button.innerHTML = isText
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
  };

  document.addEventListener('DOMContentLoaded', () => {
    const refCode = getReferralFromURL();
    if (refCode) autoFillReferral(refCode);
    document.getElementById('referral').addEventListener('input', validateReferral);
    document.getElementById('password').addEventListener('input', (e) => {
      const p = e.target.value; let score = 0;
      if (p.length >= 6) score++; if (p.length >= 8) score++; if (/[A-Z]/.test(p)) score++; if (/[0-9]/.test(p)) score++; if (/[^A-Za-z0-9]/.test(p)) score++;
      for (let i = 1; i <= 5; i++) { const seg = document.getElementById('seg' + i); seg.classList.remove('weak', 'medium', 'strong'); if (i <= score) { if (score <= 2) seg.classList.add('weak'); else if (score <= 3) seg.classList.add('medium'); else seg.classList.add('strong'); } }
      if (score >= 2) updateProgress(2);
    });
    document.querySelectorAll('.form-input').forEach(input => { input.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleRegister(); }); });
  });

  window.handleRegister = async function() {
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const referralCode = document.getElementById('referral').value.trim().toUpperCase();

    if (!email) { showToast('error', 'Missing Field', 'Please enter your email address.'); return; }
    if (!phone) { showToast('error', 'Missing Field', 'Please enter your phone number.'); return; }
    if (!password || password.length < 6) { showToast('error', 'Weak Password', 'Password must be at least 6 characters.'); return; }
    if (password !== confirm) { showToast('error', 'Mismatch', 'Passwords do not match.'); return; }
    const cleanPhone = phone.replace(/\s/g, '');
    if (!/^(\+234|0)?[789]\d{9}$/.test(cleanPhone)) { showToast('error', 'Invalid Phone', 'Enter a valid Nigerian phone number.'); return; }

    updateProgress(4); setLoading(true);
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      const uid = cred.user.uid; let referredBy = null;
      if (referralCode) { const codeDoc = await getDoc(doc(db, 'referralCodes', referralCode)); if (codeDoc.exists()) { const userDoc = await getDoc(doc(db, 'users', codeDoc.data().uid)); if (userDoc.exists() && codeDoc.data().uid !== uid) referredBy = codeDoc.data().uid; } }
      const shortCode = uid.substring(0, 8).toUpperCase();
      await setDoc(doc(db, 'users', uid), { uid, email, phone: cleanPhone, referredBy, referralCode: shortCode, depositWallet: 0, withdrawalWallet: 0, totalDeposits: 0, totalWithdrawals: 0, activeInvestments: 0, referralEarnings: 0, totalEarnings: 0, currency: 'NGN', createdAt: serverTimestamp(), status: 'active' });
      await setDoc(doc(db, 'referralCodes', shortCode), { uid, createdAt: serverTimestamp() });
      setLoading(false);
      showToast('success', 'Welcome to Evonance! 🎉', 'Account created. Redirecting to your dashboard...');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
    } catch (error) { setLoading(false); updateProgress(0); showToast('error', 'Registration Failed', getErrorMessage(error.code)); }
  };
</script>
</body>
